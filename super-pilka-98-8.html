<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10211e"><title>Super Piłka ’98</title><style>
:root {

}
*{box-sizing:border-box} [hidden],.ov.hide{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1915;color:var(--paper);font:15px/1.35 var(--sans)}
button,input{font:inherit} button{cursor:pointer;color:inherit} button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:3px}

.ov{display:grid;place-items:center;z-index:20;background:linear-gradient(125deg,rgba(4,16,14,.66),rgba(9,18,23,.48));padding:3vh 3vw;overflow:auto}
.lobby,.dialog{background:#10211e;border:1px solid rgba(208,235,212,.29);box-shadow:0 28px 80px #0008}
.lobby{width:min(1120px,100%);align-self:safe center;position:relative;background:rgba(10,29,24,.81);backdrop-filter:blur(3px)}
.lobbyHead,.lobbyFoot,.sideHead,.eyebrow,.venue,.lang,.tabs,.brand,.quiet,.actions,.summary,.bt,.clubInput{display:flex;align-items:center}
.lobbyHead,.lobbyFoot{justify-content:space-between;padding:0 3.7%;background:rgba(10,26,22,.90)}
.lobbyHead{height:68px;border-bottom:1px solid var(--edge)}.brand{gap:12px;font-family:var(--display);font-style:italic;font-weight:900;letter-spacing:-.05em;font-size:24px}

button{border:0}.quiet{background:none;gap:8px;font-size:13px;font-weight:650;padding:9px 0 9px 12px}.quiet:hover,.tabs button:hover{color:var(--lime)}.keyIcon{font-size:24px;line-height:.9;color:var(--lime)}
.lobbyBody{display:grid;grid-template-columns:.84fr 1.16fr}.hero{position:relative;isolation:isolate;overflow:hidden;padding:clamp(28px,3.4vw,50px);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:394px;
  background:linear-gradient(106deg,rgba(14,47,33,.92),rgba(34,75,46,.24))}

.eyebrow{gap:9px}.eyebrow i,.venue i{width:7px;height:7px;border-radius:50%;background:var(--lime);display:inline-block}
h1,h2,p{margin:0}.hero h1{font:italic 950 clamp(56px,6.5vw,99px)/.85 var(--display);letter-spacing:-.069em;text-transform:uppercase;margin:17px 0 22px}
h1 span,h1 em{display:block}h1 em{color:var(--lime);font-style:inherit}.summary{flex-direction:column;align-items:flex-start;gap:4px}.summary strong{font-size:16px}.summary span,.note{font-size:13px;color:var(--muted)}

.bt:hover{background:#3a5042}.bt.primary{color:#112019;background:var(--lime);border-color:var(--lime)}.bt.primary:hover{background:#edff9a}.hero .bt{margin-top:28px;min-width:min(100%,230px);justify-content:space-between;padding:14px 20px;font-size:16px}.bt span[aria-hidden]{font-size:20px;line-height:1}

.tabs{border-bottom:1px solid var(--edge);gap:24px;margin:0 0 18px}.tabs button{padding:8px 0 10px;position:relative;color:var(--muted);background:none;font-weight:650;font-size:14px}
.tabs button.on{color:var(--lime)}.tabs button.on:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:3px;background:var(--lime)}
.teamGrid,.settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start}.page{flex:1}
.sideH{--team:var(--home);--wash:#523837}.sideA{--team:var(--away);--wash:#223f55}
.teamCard,.tactCard{min-width:0;padding:14px 14px 17px;border:1px solid var(--edge);position:relative;background:linear-gradient(155deg,var(--wash),#1a2c26 82%)}
.teamCard{display:flex;flex-direction:column}.sideHead{gap:6px;color:#e8ece5;font-size:10px}.sideHead i{height:9px;width:3px;background:var(--team);transform:skewX(-15deg)}

.clubInput{border-bottom:1px solid #ffffff58;padding:3px 0 5px;gap:4px}.clubInput input{font:800 clamp(15px,1.6vw,22px)/1.1 var(--display);letter-spacing:-.02em;color:#fbfff5;background:none;width:100%;min-width:0;border:0;outline-offset:0;text-transform:uppercase}.clubInput span{color:var(--muted)}.clubPlan{font:650 11px var(--sans);color:var(--muted);letter-spacing:.02em;margin-top:9px}
.tactCard strong{display:block;font-size:14px;margin:5px 0}.tactCard canvas{width:100%;height:auto;display:block;margin:6px 0 10px}.set+.set{margin-top:10px}
.set{min-width:0}.set label{color:var(--muted);display:block;margin-bottom:5px;font-size:9px}
.seg{display:flex;gap:2px}.seg button{min-width:0;flex:1;padding:7px 3px;font-size:11px;line-height:1.2;background:#ffffff0d;color:#dee6de;border:1px solid #ffffff18}.seg button:hover{background:#ffffff1a}.seg button.on{background:#d9ff5918;border-color:#bddb596b;color:var(--lime);font-weight:700}
.settings{gap:12px 16px}.settings .set{margin:0}.lobbyFoot{min-height:47px;border-top:1px solid var(--edge)}.venue{gap:9px;color:var(--muted);font-size:9px}.venue i{width:5px;height:5px}.venue b{color:#728679}.lang{gap:10px;color:var(--muted);font-size:9px}.lang .seg button{padding:4px 8px;font-size:10px}
.dialog{width:min(600px,100%);max-height:90dvh;overflow:auto;padding:clamp(18px,3.5vw,42px)}.dialog h2{font:italic 900 clamp(24px,3.4vw,46px)/1.1 var(--display);letter-spacing:-.035em;margin:8px 0 18px}.actions{flex-wrap:wrap;gap:6px;margin-top:20px}
.dialog.help{width:min(1140px,100%)}#helpCols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.help h3{font-size:13px;margin:0 0 8px;color:var(--lime)}.keys{border-collapse:collapse;width:100%}.keys td{padding:4px 2px;border-top:1px solid #ffffff13;font-size:11px}.keys td:first-child{font-weight:700;width:34%;white-space:nowrap}.kbd{color:var(--lime)}.help .note{margin:16px 0}
.stats table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.stats th,.stats td{padding:5px 4px}.stats thead th:first-child,.stats td:first-child{text-align:left}.stats thead th:last-child,.stats td:last-child{text-align:right}.stats tbody th{font-size:12px;font-weight:500;color:#c7d2ca}.stats tr{border-bottom:1px solid var(--edge)}.stats td{font-weight:700}.winline{margin:-10px 0 12px;color:var(--lime);font-weight:700}
#hud{pointer-events:none;z-index:10;display:none;--gap:clamp(10px,2.2vw,38px)}#hud.show{display:block}
#score{position:absolute;left:var(--gap);top:var(--gap);display:flex;font-family:var(--sans);height:35px;background:#10211ef2;box-shadow:0 3px 15px #0004;font-variant-numeric:tabular-nums}
#score>div{display:flex;align-items:center;padding:0 11px}#score .clk{gap:5px;color:var(--lime);font-size:14px;font-weight:800;border-left:3px solid var(--lime)}.clk small{font-size:9px;color:var(--muted)}
#score .sc{background:var(--paper);color:var(--night);gap:6px;font-size:20px;font-weight:900}.sc .dash{font-size:12px;color:#65746b}#score .t{position:relative;letter-spacing:.05em;font-size:13px;font-weight:800;gap:3px}#score .t:after{content:"";height:3px;position:absolute;bottom:0;left:0;right:0;background:var(--home)}#score .away:after{background:var(--away)}
#cardsH,#cardsA{display:flex;gap:2px}.cardDot{background:#ffd54a;width:5px;height:8px}.cardDot.red{background:#ff635a}

#hintbar{right:var(--gap);top:var(--gap);max-width:42vw;text-align:right;white-space:normal;font-weight:650;font-size:12px;text-shadow:0 1px 4px black;background:#10211ed6;padding:6px 10px}#hintbar:empty{display:none}#hud.replaying #hintbar{top:calc(var(--gap) + 36px);z-index:3}

#comm{left:var(--gap);top:calc(var(--gap) + 77px);color:#f8faf4;background:#10211ee0;padding:4px 9px;font-size:12px;visibility:hidden;max-width:46vw}#comm:empty{display:none}
#fieldHUD{position:absolute;inset:auto var(--gap) var(--gap);display:flex;align-items:flex-end;justify-content:space-between;gap:6px}#radar{width:clamp(112px,14vw,185px);height:auto;opacity:.94}
.playerPlate{display:flex;align-items:stretch;min-width:clamp(110px,14vw,198px);padding:5px 10px 6px 5px;gap:8px;background:#0c1d1aeb;border-bottom:2px solid var(--team)}
.plateNo{width:28px;display:grid;place-items:center;font:bold italic 21px var(--display);color:var(--team)}.plateName{flex:1;min-width:0}.plateName strong,.plateName small{display:block}.plateName strong{font:800 14px/1.2 var(--sans);text-transform:uppercase}.plateName small{color:#c2d1c9;letter-spacing:.06em;font-size:8px;margin-bottom:2px}.stamina{height:3px;background:#fefff839;display:block;margin-top:4px}.stamina i{display:block;height:100%;width:100%;background:var(--lime);transform-origin:left}
#pwr{display:none;position:absolute;bottom:calc(var(--gap) + clamp(70px,8.4vw,112px));left:50%;transform:translateX(-50%);width:110px;height:7px;background:#12231e;border:1px solid #fff8}#pwr.show{display:block}#pwrFill{height:100%;background:linear-gradient(90deg,#abef60,#ffe24d,#ff775e)}
.lb{position:absolute;left:0;right:0;height:0;background:#080f0d;z-index:1;transition:height .3s}.lb.show{height:8vh}#lbT{top:0}#lbB{bottom:0}#hud.replaying #fieldHUD,#hud.replaying #score,#hud.replaying #comm{visibility:hidden}
#splash{z-index:30;display:grid;place-content:center;gap:9px;text-align:center;background:#10211e;color:var(--muted)}#splash b{font:italic 900 36px var(--display);color:var(--lime)}
@media(max-width:800px){.lobbyBody{grid-template-columns:.66fr 1fr}.hero{padding:24px}.editor{padding:15px}.tabs{gap:14px}.teamCard,.tactCard{padding:10px}.seg button{font-size:10px}.teamGrid{gap:8px}.settings{gap:10px}#helpCols{grid-template-columns:1fr 1fr}.dialog.help{max-height:90dvh}}

@media(max-height:530px) and (min-width:641px){.ov{padding:8px 2vw;align-items:start}.lobby{margin:auto}.lobbyHead{height:39px}.lobbyFoot{min-height:30px}.hero{min-height:240px;padding:12px 25px}.hero h1{font-size:48px;margin:10px 0}.hero .bt{margin-top:12px;padding:8px 12px}.editor{padding:8px 18px}.tabs{margin-bottom:8px}.kitArt{min-height:40px}.kitArt canvas{max-height:106px}.tactCard canvas{max-height:54px}.set+.set{margin-top:5px}.settings{gap:6px}.seg button{padding:4px}.dialog{max-height:95dvh}}
.kitArt{border:0;background:radial-gradient(ellipse at 50% 80%,#bdcaa01c,transparent 68%);padding:0;cursor:zoom-in;isolation:isolate}
.kitArt canvas{height:clamp(138px,16vw,209px);max-height:none;filter:none}
.kitArt span{position:absolute;bottom:2px;right:6px;font-size:9px;font-weight:650;color:var(--paper);border:1px solid #eeeece45;background:#0b1d18c9;padding:3px 5px}
.kitArt:hover span{color:var(--lime);border-color:var(--lime)}
.modelDialog{width:min(650px,100%);padding:clamp(15px,2vw,25px)}.modelHead,.modelAngles,.modelControls{display:flex;align-items:center;gap:10px}.modelHead{justify-content:space-between}.modelHead h2{margin:5px 0 8px;font-size:30px}

.venueLink{padding:7px 0;background:transparent;border-bottom:1px solid #d9ff596b;color:var(--lime);font:inherit;letter-spacing:.09em;text-transform:uppercase}.venueLink:hover{border-color:var(--lime)}

/* Grafika transmisji telewizyjnej. */
#score{top:clamp(5px,1.35vh,16px);left:clamp(6px,1.3vw,22px);height:clamp(23px,3.3vh,34px);background:linear-gradient(180deg,#162c4be6,#19384bcc);border-top:2px solid #aeb9b9;border-bottom:1px solid #879ca8;box-shadow:0 1px 4px #09192659;font-style:italic}

  padSeen: [false, false],

  wheelAcc: 0,            // akumulowane kółko myszy (zoom kamery)

  /* normalizacja: realne przeglądarki dają e.code, syntetyczne tylko e.key */
  _norm: function(e){
    if(e.code && e.code.length) return e.code;
    var k = e.key || "";
    var map = { " ": "Space", ",": "Comma", ".": "Period", "/": "Slash" };
    if(map[k]) return map[k];
    if(k.length === 1) return "Key" + k.toUpperCase();
    return k; /* Escape, Enter, ArrowUp... */

  init: function(){

      if(MAIN.state==="match" && !MAIN.paused && ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space","Enter"].includes(c))e.preventDefault();
      self.kb[c] = true;
    });
    window.addEventListener("keyup", function(e){ self.kb[self._norm(e)] = false; });
    window.addEventListener("blur", function(){ self.kb = {}; });
    /* kółko myszy — interaktywny zoom kamery (tylko odczyt, bez blokowania) */
    window.addEventListener("wheel", function(e){
      var dy = e.deltaY || 0;
      if(e.deltaMode === 1) dy *= 33;          // linie -> piksele
      else if(e.deltaMode === 2) dy *= 100;    // strony -> piksele
      if(MAIN.state==="match" && !MAIN.paused)self.wheelAcc += dy;
    }, { passive:true });

  /* ruch sędziów w trakcie meczu (kosmetyka — nie kolidują z grą) */
  tickStaff: function(dt, state){
    var st = this.staff; if(!st) return;
    if(state==="booking" && BROADCAST.scene){BROADCAST.officials(dt);return;}
    if(state === "replay") return;
    var b = SIM.ball; if(!b) return;
    /* główny: trzyma się ~8 m od piłki, ustawiony skosem do akcji */
    var rf = st.ref, rp = rf.userData.pos;
    var tx = Math.max(-HL+2, Math.min(HL-2, b.x*0.88));
    var tz = Math.max(-HW+2, Math.min(HW-2, b.z*0.55 + (b.z >= 0 ? -8 : 8)));
    var dx = tx-rp.x, dz = tz-rp.z, d = Math.hypot(dx, dz);
    var spd = Math.min(6.2, d*2.0);
    if(d > 0.06){ rp.x += dx/d*spd*dt; rp.z += dz/d*spd*dt; }
    rf.position.set(rp.x, 0, rp.z);
    rf.rotation.y = Math.atan2(b.x-rp.x, b.z-rp.z);
    this.animatePlayer(rf, d > 0.5 ? spd : 0, dt, "run", 0);
    /* liniowi: bieg wzdłuż linii autu, na wysokości piłki (z małym wyprzedzeniem) */
    for(var i=0;i<2;i++){
      var ln = st.lins[i], lp = ln.userData.pos;
      var lz = (i===0 ? 1 : -1)*(HW+1.15);
      var lx = Math.max(-HL-2, Math.min(HL+2, b.x + b.vx*0.22));
      var mdx = lx - lp.x;
      var ms = Math.min(5.8, Math.abs(mdx)*2.0);
      if(Math.abs(mdx) > 0.05) lp.x += (mdx > 0 ? 1 : -1) * ms * dt;
      lp.z = lz;
      ln.position.set(lp.x, 0, lz);
      ln.rotation.y = Math.abs(mdx) > 0.3 ? Math.atan2(mdx, 0.6) : Math.atan2(b.x-lp.x, b.z-lz);
      this.animatePlayer(ln, Math.abs(mdx) > 0.4 ? ms : 0, dt, "run", 0);
    }
  },

  _markers: function(){
    /* wskaźnik gracza P1 / P2: pierścień + strzałka nad głową */
    function mkMark(ringColor,jewelColor){
      var grp=new THREE.Group();
      var ring=new THREE.Mesh(new THREE.RingGeometry(.45,.61,40),
        new THREE.MeshBasicMaterial({color:ringColor,side:THREE.DoubleSide,depthWrite:false}));
      ring.rotation.x=-Math.PI/2;ring.position.y=.035;
      var jewel=new THREE.Mesh(new THREE.OctahedronGeometry(.175),
        new THREE.MeshLambertMaterial({color:jewelColor,emissive:jewelColor,emissiveIntensity:.21}));
      jewel.scale.y=1.35;jewel.position.y=2.20;
      grp.add(ring,jewel);grp.userData={ring:ring,arrow:jewel};grp.visible=false;
      return grp;
    }
    this.m1=mkMark(0xffe448,0xdf262d);this.m2=mkMark(0x88ceff,0x2757df);
    this.gFx.add(this.m1, this.m2);
    /* piłka: cień „kropelka” */
    var blobCv = this._mkCanvas(64,64), bg = blobCv.getContext("2d");
    var gr = bg.createRadialGradient(32,32,4,32,32,30);
    gr.addColorStop(0,"rgba(0,0,0,0.5)"); gr.addColorStop(1,"rgba(0,0,0,0)");
    bg.fillStyle = gr; bg.fillRect(0,0,64,64);
    this.blob = new THREE.Mesh(new THREE.PlaneGeometry(1,1),
      new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(blobCv), transparent:true, depthWrite:false }));
    this.blob.rotation.x = -Math.PI/2;
    this.gFx.add(this.blob);
    var footprint=new THREE.PlaneGeometry(1.05,.74);footprint.rotateX(-Math.PI/2);
    this.contactShadows=new THREE.InstancedMesh(footprint,new THREE.MeshBasicMaterial({
      map:this.blob.material.map,transparent:true,opacity : 0.77,depthWrite:false}),22);
    this.contactShadows.count=0;this.contactShadows.frustumCulled=false;
    this.shadowMatrix=new THREE.Matrix4();this.gFx.add(this.contactShadows);
    /* strzałka namieru przy wznowieniach */
    // Przekroje dwuspadowej strzałki. Przód wskazuje lokalne +Z, jak stopa wykonawcy.
    var arrowVerts=[],arrowColors=[];
    function triangle(a,b,c,color){
      var rgb=new THREE.Color(color).convertSRGBToLinear();
      [a,b,c].forEach(function(p){arrowVerts.push(p[0],p[1],p[2]);arrowColors.push(rgb.r,rgb.g,rgb.b);});
    }
    function section(z,width,top){return [[-width,top-.15,z],[0,top,z],[width,top-.15,z]];}
    var rows=[section(.30,.15,.21),section(2.12,.20,.63),section(2.13,.44,.64),section(3.25,.02,.94)];
    for(var r=1;r<rows.length;r++){
      var a=rows[r-1],b=rows[r];
      for(var i=0;i<2;i++){
        var color=r===3?(i?0xaa3026:0xf66029):i?0xcf7428:0xffca48;
        triangle(a[i],b[i],a[i+1],color);triangle(a[i+1],b[i],b[i+1],color);
      }
      triangle(a[0],a[2],b[0],0x71301e);triangle(a[2],b[2],b[0],0x71301e);
    }
    var geom=new THREE.BufferGeometry();
    geom.setAttribute("position",new THREE.Float32BufferAttribute(arrowVerts,3));
    geom.setAttribute("color",new THREE.Float32BufferAttribute(arrowColors,3));
    this.aimArrow=new THREE.Mesh(geom,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide}));
    this.aimArrow.visible = false;
    this.gFx.add(this.aimArrow);
  },

  playerShadows: function(players){

  _stepPlayer: function(pl, dt){

  standingTackle: function(pl){

    if(kind==="through"){ sp = 14 + 14*power; vy = 0.8 + 1.6*power; }
    if(kind==="shot"){    sp = 17 + 17*power; vy = 1.2 + 5.2*power; }
    if(kind==="finesse"){sp=17+11*power;vy=2.6+2.5*power;}
    if(kind==="clear"){   sp = 16 + 10*power; vy = 5.5 + 2*power; }
    if(kind==="throw"){   sp = 7 + 6*power;  vy = 3.3; }
    if(kind==="cross"){   sp = 12 + 6*power; vy = 5.6; curve = (Math.random()<0.5?-1:1)*(1.4+power); }
    if(kind==="gklong"){  sp = 21 + 7*power; vy = 7.2; }
    if(kind==="penclear"){sp = 18 + 8*power; vy = 3.0; }
    if(kind==="header"){  sp = 10 + 9*power;  vy = 0.8 + 2.4*power; }
    if(kind==="knee"){    sp = 13 + 10*power; vy = 1.0 + 3.2*power; }

    }
    b.owner = null;
    b.vx = dx*sp; b.vz = dz*sp; b.vy = vy;

      if(s > bs){ bs = s; best = m; }
    }
    return best;
  }
};

/* ============================================================
   SUPER PILKA '98 · 07-ai.js — sztuczna inteligencja 11v11
   Formacja 4-4-2, pressing, krycie, decyzje z piłką, bramkarz.

var AI = {
  frozen: false,   // podczas wznowień AI stoi na pozycjach wyznaczonych przez zasady

  clampX: function(v){ return Math.max(-HL+2, Math.min(HL-2, v)); },
  clampZ: function(v){ return Math.max(-HW+2, Math.min(HW-2, v)); },

  update: function(dt, owner){
    var b = SIM.ball;
    var D = DIFF[SET.diff];
    for(var t=0;t<2;t++){
      var mates = SIM.teamPlayers(t);
      var opps  = SIM.teamPlayers(1-t);
      var dirX = SIM.teams[t].dir;
      var plan=LINEUP.tactic(t);
      var opposingLine=opps.map(function(p){return p.pos.x*dirX;}).sort(function(a,b){return b-a;})[1]||0;
      var phase = "loose";
      if(b.owner) phase = b.owner.team===t ? "attack" : "defend";
      else if(b.lastTouchTeam===t) phase = "attackLoose";
      else phase = "loose";

      /* najbliższy do piłki (poza GK) */
      var chaser = null, chaser2 = null, cd = 1e9, cd2 = 1e9;
      for(var i=0;i<mates.length;i++){
        var m = mates[i];
        if(m.role==="GK") continue;
        var d = (m.pos.x-b.x)*(m.pos.x-b.x)+(m.pos.z-b.z)*(m.pos.z-b.z);
        if(d < cd){ cd2 = cd; chaser2 = chaser; cd = d; chaser = m; }
        else if(d < cd2){ cd2 = d; chaser2 = m; }
      }

      for(var k=0;k<mates.length;k++){
        var pl = mates[k];
        if(pl.isUser !== null) continue;   // sterowany przez człowieka
        if(pl.role==="GK"){ this.gk(pl, dt, D); continue; }
        pl.closeControl=false;
        if(this.frozen){ pl.moveTarget = null; continue; }

        /* --- właściciel piłki (AI) --- */
        if(b.owner===pl){
          this.decide(pl, dt, D, opps, dirX);
          continue;
        }
        if(!b.owner && b.receiver===pl && b.route){
          pl.moveTarget=this.receiveTarget(pl);continue;
        }
        if(pl.runT>0 && (!b.owner || b.owner.team===t) && b.lastTouchTeam===t){
          pl.moveTarget={x:this.clampX(pl.pos.x+dirX*9),z:this.clampZ(pl.pos.z*.96),sprint:true};continue;
        }
        if(!b.owner && (!b.receiver || b.receiver.team!==t) && (pl===chaser || (pl===chaser2 && cd2<50))){
          pl.moveTarget={x:this.clampX(b.x+b.vx*.20),z:this.clampZ(b.z+b.vz*.20),sprint:true};continue;
        }
        /* --- pressing przy posiadaniu przeciwnika --- */
        if(b.owner && b.owner.team!==t){
          if(pl===chaser){
            pl.moveTarget={x:b.x+b.owner.vel.x*.10,z:b.z+b.owner.vel.z*.10,sprint:true};
            if(cd<2.3 && pl.challengeCd<=0)SIM.standingTackle(pl);
            continue;
          }
          if(pl===chaser2 && (plan==="press" || (plan==="balanced" && cd2<100))){
            var gx0 = -dirX*HL;
            var bx = (b.owner.pos.x-gx0), bz = (b.owner.pos.z);
            var bl = Math.hypot(bx, bz)||1;
            pl.moveTarget = { x: b.owner.pos.x + (gx0-b.owner.pos.x)/bl*4.5, z: b.owner.pos.z - bz/bl*2, sprint: true };
            continue;
          }
        }
        /* --- krycie przy obronie --- */
        if(phase==="defend"){
          var mark = this.findMark(pl, opps, mates, D.mark);
          if(mark){
            var tgx = -dirX*HL;
            var mdx = tgx-mark.pos.x, mdz = 0-mark.pos.z;
            var ml = Math.hypot(mdx, mdz)||1;
            pl.moveTarget = { x: mark.pos.x + mdx/ml*1.7, z: mark.pos.z + mdz/ml*1.7, sprint: Math.abs(mark.pos.x-pl.pos.x)>8 };
            continue;
          }
        }
        pl.moveTarget=this.formationTarget(pl,dirX,phase==="attack" || phase==="attackLoose",opposingLine,plan);
      }
    }
  },

  receiveTarget: function(pl){
    var b=SIM.ball, r=b.route, v2=b.vx*b.vx+b.vz*b.vz;
    if(!r)return {x:b.x,z:b.z,sprint:true};
    var t=v2?((pl.pos.x-b.x)*b.vx+(pl.pos.z-b.z)*b.vz)/v2:0;
    if(b.flight==="pass" && t>=0 && t<1 && b.y<1.2){
      return {x:b.x+b.vx*t,z:b.z+b.vz*t,sprint:true};
    }
    if(v2<12 || Math.hypot(b.x-r.x,b.z-r.z)<2.5 || (r.x-b.x)*b.vx+(r.z-b.z)*b.vz<0)
      return {x:b.x+b.vx*.15,z:b.z+b.vz*.15,sprint:true};
    return {x:r.x,z:r.z,sprint:true};
  },
  formationTarget: function(pl,dir,attacking,line,plan){
    var b=SIM.ball,bx=b.x*dir,homeX=pl.home.x,homeZ=pl.home.z*dir;
    var advance=attacking?(pl.role==="DF"?10:17):2;
    var depth=homeX+advance+bx*(pl.role==="DF" ? 0.51 : 0.54)+(plan==="press"?5:0);
    if(pl.role==="FW" && attacking)depth=Math.max(depth,bx+7+(plan==="counter"?6:0));
    if(attacking && pl.role!=="DF")depth=Math.min(depth,Math.max(0,line-1.1,bx-.4));
    if(!attacking && plan==="counter")depth-=4.5;
    var width=attacking?1.05 : 0.78;
    var tz=homeZ*width+b.z*(attacking ? 0.19 : 0.29);
    if(attacking && Math.abs(homeZ)>17 && bx>29 && Math.sign(homeZ)!==Math.sign(b.z))tz*=.64;
    return {x:this.clampX(dir*depth),z:this.clampZ(tz),sprint:attacking && plan==="counter" && pl.role!=="DF"};
  },

  findMark: function(pl, opps, mates, slack){
    var best = null, bs = 1e9;
    var gx = -SIM.teams[pl.team].dir*HL;
    for(var i=0;i<opps.length;i++){
      var o = opps[i];
      if(o.role==="GK") continue;
      if(o.pos.x*SIM.teams[pl.team].dir < 0 && o.role==="DF") continue; /* daleko u siebie */
      var d = Math.hypot(o.pos.x-pl.pos.x, o.pos.z-pl.pos.z);
      if(d > 18) continue;
      /* nie kradnij krycia kolegi bliższego */
      var mateCloser = false;
      for(var j=0;j<mates.length;j++){
        var m2 = mates[j];
        if(m2===pl || m2.role==="GK") continue;
        var d2 = Math.hypot(o.pos.x-m2.pos.x, o.pos.z-m2.pos.z);
        if(d2 < d - 1.5){ mateCloser = true; break; }
      }
      if(mateCloser) continue;
      var danger = Math.abs(o.pos.x - gx) < 30 ? 0 : 8;
      var s = d + danger;
      if(s < bs){ bs = s; best = o; }
    }
    return best;
  },

  /* ---------- decyzje AI z piłką ---------- */
  decide: function(pl, dt, D, opps, dirX){
    var b = SIM.ball;
    if(pl.decideCd > 0){
      /* drybling w kierunku bramki z unikiem */
      var weave = Math.sin(RULES.elapsed*1.4 + pl.idx)*0.5;
      var gx = dirX*HL;
      var dx = gx-pl.pos.x, dz = 0-pl.pos.z + weave*8;
      var l = Math.hypot(dx, dz)||1;
      dx/=l; dz/=l;
      var spread = this.spreadAhead(pl, opps, dx, dz);
      if(spread < 2.2){
        var side = (pl.idx%2===0) ? -1 : 1;
        var px = -dz, pz = dx;          /* kierunek prostopadły */
        dx = px*side; dz = pz*side;
        var l2 = Math.hypot(dx, dz)||1; dx/=l2; dz/=l2;
      }
      pl.moveTarget = { x: this.clampX(pl.pos.x + dx*6), z: this.clampZ(pl.pos.z + dz*6), sprint: spread > 4 };
      return;
    }
    pl.decideCd = D.react + Math.random()*0.15;
    var distGoal = Math.hypot(dirX*HL-pl.pos.x, pl.pos.z);
    var pressure = this.nearestOppDist(pl, opps);

    /* strzał */
    var shootRange = 20 + D.aiIQ*8;
    if(distGoal < shootRange && Math.abs(pl.pos.z) < 20 && Math.random() < 0.55+D.aiIQ*0.4){
      var aimZ = (Math.random()*2-1)*3.1*D.aiIQ;
      var tx = dirX*HL, tz = aimZ + (Math.random()*2-1)*D.shotErr;
      var pdx = tx-pl.pos.x, pdz = tz-pl.pos.z;
      var pl2 = Math.hypot(pdx, pdz)||1;
      pl.moveTarget = null;
      SIM.kick(pl, pdx/pl2, pdz/pl2, Math.min(1, 0.55+distGoal/34), "shot");
      RULES.onShot(pl);
      return;
    }
    /* ocena podań */
    var bestMate = null, bestScore = -1e9;
    var mates = SIM.teamPlayers(pl.team);
    for(var i=0;i<mates.length;i++){
      var m = mates[i];
      if(m===pl || m.role==="GK") continue;
      var dxm = m.pos.x-pl.pos.x, dzm = m.pos.z-pl.pos.z;
      var dm = Math.hypot(dxm, dzm);
      if(dm < 4 || dm > 38) continue;
      var prog = dxm*dirX;
      if(prog < -8 && pressure < 5) continue;
      var open = this.laneOpenness(pl, m, opps);
      var sc = open*10 + prog*0.35 - Math.abs(dm-16)*0.12;
      if(dm > 26) sc -= 3;
      if(sc > bestScore){ bestScore = sc; bestMate = m; }
    }
    /* podanie pod presją albo gdy dobra opcja */
    var passThresh = pressure < 4 ? 1.5 : 28+(1-D.aiIQ)*10;
    if(Math.abs(pl.pos.z)>16 && pl.pos.x*dirX>24){
      var inside=mates.filter(function(m){return m!==pl && m.pos.x*dirX>20 && Math.abs(m.pos.z)<15;})
        .sort(function(a,b){return b.pos.x*dirX-a.pos.x*dirX;})[0];
      if(inside){SIM.deliver(pl,inside,"cross",.72,dirX,0);return;}
    }
    if(bestMate && bestScore > passThresh && (pressure<6 || bestMate.pos.x*dirX>pl.pos.x*dirX+3)){
      var through=(bestMate.runT>0 || (bestMate.role==="FW" && pressure<5 && bestMate.pos.x*dirX>0));
      SIM.deliver(pl,bestMate,through?"through":"pass",.46+D.aiIQ*.25,dirX,0);

      return;
    }
    /* drybling / wybij z zagrożenia */
    if(pressure < 2.2 && (pl.role==="DF") && distGoal > 30){
      SIM.kick(pl, dirX, (Math.random()*2-1)*0.7, 0.8, "clear");
      return;
    }
    /* kontynuacja dryblingu */
    this.decide(pl, dt, D, opps, dirX);
    pl.decideCd = D.react*0.5;
  },

  spreadAhead: function(pl, opps, dx, dz){
    var best = 1e9;
    for(var i=0;i<opps.length;i++){
      var o = opps[i];
      var rx = o.pos.x-pl.pos.x, rz = o.pos.z-pl.pos.z;
      var proj = rx*dx+rz*dz;
      if(proj < 0 || proj > 9) continue;
      var perp = Math.abs(rx*dz - rz*dx);
      best = Math.min(best, perp);
    }
    return best===1e9 ? 9 : best;
  },
  nearestOppDist: function(pl, opps){
    var d = 1e9;
    for(var i=0;i<opps.length;i++){
      var dd = Math.hypot(opps[i].pos.x-pl.pos.x, opps[i].pos.z-pl.pos.z);
      if(dd < d) d = dd;
    }
    return d;
  },
  laneOpenness: function(a, m, opps){
    var dx = m.pos.x-a.pos.x, dz = m.pos.z-a.pos.z;
    var l = Math.hypot(dx,dz)||1;
    var best = 99;
    for(var i=0;i<opps.length;i++){
      var o = opps[i];
      var rx = o.pos.x-a.pos.x, rz = o.pos.z-a.pos.z;
      var proj = rx*dx/l + rz*dz/l;
      if(proj < 0 || proj > l) continue;
      var perp = Math.abs(rx*dz/l - rz*dx/l);
      best = Math.min(best, perp);
    }
    return Math.min(best, 8);
  },

  /* ---------- bramkarz ---------- */
  gk: function(pl, dt, D){
    var b = SIM.ball;
    var t = pl.team, dirX = SIM.teams[t].dir;
    var gx = -dirX*HL;   // własna bramka

    if(b.owner===pl){
      /* rozegranie po chwili */
      /* Czas decyzji odlicza fizyka zawodnika. */
      if(pl.decideCd <= 0){
        var mates = SIM.teamPlayers(t);
        var fb = null, bd = 1e9;
        for(var i=0;i<mates.length;i++){
          var m = mates[i];
          if(m===pl || m.role==="GK") continue;
          var d = Math.hypot(m.pos.x-pl.pos.x, m.pos.z-pl.pos.z);
          if(d<bd && m.role==="DF"){ bd=d; fb=m; }
        }
        if(fb && Math.random()<0.6 && bd<26){
          SIM.deliver(pl,fb,"pass",.45,dirX,0);
        } else {
          SIM.kick(pl, dirX, (Math.random()*2-1)*0.6, 0.85, "gklong"); RULES.onPass(pl,null);
        }
      }
      pl.moveTarget = null;
      return;
    }
    var inBox=Math.abs(b.x-gx)<16.5 && Math.abs(b.z)<20.1;
    var shot=!b.owner && b.shotTeam===1-t && (gx-b.x)*b.vx>0;
    if(shot && Math.abs(b.vx)>3){
      var eta=(gx-b.x)/b.vx, iz=b.z+b.vz*eta;
      if(eta>0 && eta<1.15 && Math.abs(iz)<6){
        pl.moveTarget={x:gx+dirX*1.0,z:this.clampZ(iz),sprint:true};
        var d=Math.hypot(b.x-pl.pos.x,b.z-pl.pos.z);
        if(d<1.60+D.gk*.55 && b.y<2.7 && pl.challengeCd<=0){
          pl.challengeCd=.76;pl.diveSide=-(b.z>pl.pos.z?1:-1)*dirX;
          pl.face=Math.atan2(dirX,0);pl.action="dive";pl.actionT=.65;
          pl.vel.z=(b.z>pl.pos.z?1:-1)*3.4;
          if(d<.82 || Math.random()<D.gk*.86){
            var caught=d<1.18 && b.y<1.8;
            RULES.onSave(pl,caught);
            if(caught){SIM.takeBall(pl);pl.keeperHold=true;}
            else{b.vx=dirX*(6+Math.abs(b.vx)*.3);b.vz=(Math.sign(b.z)||1)*9;b.vy=3;
              b.lastTouchTeam=t;b.lastKicker=pl;b.shotTeam=null;b.flight="parry";b.lock=.35;}
            AUDIO.catchSnd();
          }
        }
        return;
      }
    }
    if(inBox && !b.owner && b.y<1.6 && !shot){
      pl.moveTarget={x:b.x,z:b.z,sprint:true};return;
    }
    /* pozycjonowanie na łuku */
    var bx = b.x-gx, bz = b.z;
    var bl = Math.hypot(bx, bz)||1;
    var r = Math.min(5.2, bl*0.28 + 1.2);
    var tx = gx + bx/bl*r;
    var tz = Math.max(-6.8, Math.min(6.8, bz/bl*r*0.9));
    if(!inBox) tz *= 0.7;
    pl.moveTarget = { x: tx, z: tz, sprint: false };
  }
};

/* Ustawienie operatora i aktorów na murawie pomiędzy gwizdkami. Pozycje są w metrach. */
var BROADCAST = {
  scene:null,
  minute:function(){return Math.min(90,RULES.displayMin+1)+"′";},
  freeze:function(){
    SIM.players.forEach(function(p){
      p.vel.x=p.vel.z=0;p.moveTarget=null;p.closeControl=false;
      if(!p.off){p.action="run";p.actionT=0;}
    });
    var ball=SIM.ball;
    if(ball.owner)ball.owner.keeperHold=false;
    ball.owner=null;ball.live=false;ball.vx=ball.vy=ball.vz=0;
    WORLD.aimArrow.visible=false;HUD.showPower(null);
  },
  clear:function(){
    var s=this.scene;
    if(s){
      s.actors.forEach(function(p){p.action="run";p.actionT=0;p.vel.x=p.vel.z=0;});
      if(s.extra)WORLD.removePlayer(s.extra);
      if(WORLD.staff)WORLD.staff.card.visible=false;
    }
    this.scene=null;HUD.hideEvent();
  },
  goal:function(team,scorer,own){
    this.clear();this.freeze();
    var dir=SIM.dirX(team),b=SIM.ball;
    var attackers=SIM.teamPlayers(team).filter(function(p){return p.role!=="GK";});
    function near(point){return function(p,q){
      return Math.hypot(p.pos.x-point.x,p.pos.z-point.z)-Math.hypot(q.pos.x-point.x,q.pos.z-point.z);
    };}
    var hero=scorer||attackers.sort(near(b))[0];
    var mates=attackers.filter(function(p){return p!==hero;}).sort(near(hero.pos)).slice(0,2);
    // Wracając z pola karnego, strzelec zwraca się twarzą do kamery przy linii bocznej.
    var side=hero.pos.z>HW-8?-1:1;
    var forward={x:-dir*.80,z:side*.60};
    this.scene={type:"goal",hero:hero,actors:[hero].concat(mates),forward:forward,start:{x:hero.pos.x,z:hero.pos.z}};
    var title=own?t("own_goal"):t("goal_title"),player=scorer||own;
    if(scorer)title=t("goalCount").replace("{N}",scorer.goals);
    HUD.event("goal",title,this.minute(),player?player.num+"  –  "+player.name:"",RULES.teamName(team));
    HUD.hint(t("scene_skip"));
  },
  approach:function(p,x,z,pace,dt){
    var dx=x-p.pos.x,dz=z-p.pos.z,d=Math.hypot(dx,dz),speed=Math.min(pace,d/dt);
    p.vel.x=d>.015?dx/d*speed:0;p.vel.z=d>.015?dz/d*speed:0;
    p.pos.x+=p.vel.x*dt;p.pos.z+=p.vel.z*dt;
    if(speed>.15)p.face+=SIM._angDelta(p.face,Math.atan2(dx,dz))*Math.min(1,dt*9);
    return speed;
  },
  goalStep:function(dt,time){
    var s=this.scene;if(!s)return;
    var h=s.hero,f=s.forward;
    var dist=Math.min(4.9,time*3.25);
    this.approach(h,s.start.x+f.x*dist,s.start.z+f.z*dist,3.6,dt);
    h.action=time<1.55?"goalrun":"celebrate";h.face+=SIM._angDelta(h.face,Math.atan2(f.x,f.z))*Math.min(1,dt*8);
    for(var i=1;i<s.actors.length;i++){
      var p=s.actors[i],side=i===1?1:-1;
      var speed=this.approach(p,h.pos.x+f.z*.63*side-f.x*.32,h.pos.z-f.x*.63*side-f.z*.32,6.8,dt);
      p.action=speed>.8?"run":"goalarm";
      if(speed<.8)p.face+=SIM._angDelta(p.face,h.face)*Math.min(1,dt*8);
    }
  },
  booking:function(p,victim,kind,inBox){
    this.clear();this.freeze();
    var dx=victim.pos.x-p.pos.x,dz=victim.pos.z-p.pos.z,d=Math.hypot(dx,dz);
    var fx=d>.2?dx/d:SIM.dirX(victim.team), fz=d>.2?dz/d:0;
    // Filmujemy z boku, żeby kartka i twarz ukaranego nie zasłaniały się nawzajem.
    var ref={x:p.pos.x+fx*1.10-fz*.65,z:p.pos.z+fz*1.10+fx*.65};
    var s={type:"booking",hero:p,actors:[p,victim],ref:ref,extra:null,
      restart:{team:victim.team,x:victim.pos.x,z:victim.pos.z,penalty:inBox}};
    var rx=ref.x-p.pos.x,rz=ref.z-p.pos.z,span=Math.hypot(rx,rz);
    s.victimSpot={x:p.pos.x-rx*.79+rz/span*.94,z:p.pos.z-rz*.79-rx/span*.94};
    this.scene=s;
    if(p.off)s.extra=WORLD.makePlayer(p.team,p.role==="GK",p.num,WORLD.gFx,null,p.name);
    p.face=Math.atan2(ref.x-p.pos.x,ref.z-p.pos.z);p.action="booked";
    if(s.extra){s.extra.position.set(p.pos.x,0,p.pos.z);s.extra.rotation.y=p.face;}
    victim.action="bend";
    WORLD.staff.card.material.color.setHex(kind==="red"?0xf02b28:0xffdf23);
    WORLD.staff.card.visible=true;
    HUD.event(kind,kind==="red"?t("b_red"):t("b_yellow"),this.minute(),p.num+"  –  "+p.name,RULES.teamName(p.team));
    HUD.hint(t("scene_skip"));
  },
  bookingStep:function(dt){
    var s=this.scene,v=s.actors[1];
    var pace=this.approach(v,s.victimSpot.x,s.victimSpot.z,2.55,dt);
    if(pace>.3)v.action="run";
    else {v.action="bend";v.face+=SIM._angDelta(v.face,s.hero.face)*Math.min(1,dt*6);}
  },
  officials:function(dt){
    var s=this.scene,ref=WORLD.staff.ref,p=s.hero;
    ref.userData.pos.x=s.ref.x;ref.userData.pos.z=s.ref.z;ref.position.set(s.ref.x,0,s.ref.z);
    ref.rotation.y=Math.atan2(p.pos.x-s.ref.x,p.pos.z-s.ref.z);
    WORLD.animatePlayer(ref,0,dt,"showcard",RULES.stateT,0,0,1);
    // Trzyma krótszą krawędź kartki. Przy uniesionej ręce widz powinien rozpoznać jej kolor.
    var staff=WORLD.staff,card=staff.card,eye=WORLD.cam.position;
    card.getWorldPosition(staff.cardPoint);
    var yaw=Math.atan2(eye.x-staff.cardPoint.x,eye.z-staff.cardPoint.z);
    staff.cardFacing.setFromAxisAngle(WORLD.cam.up,yaw);
    card.parent.getWorldQuaternion(card.quaternion).invert().multiply(staff.cardFacing);
    card.rotateZ(-.10);
    if(s.extra)WORLD.animatePlayer(s.extra,0,dt,"booked",RULES.stateT,0,0,1);
  },
  shot:function(time){
    var s=this.scene,p=s.hero.pos;
    if(s.type==="goal"){
      var f=s.forward, widen=Math.min(1,time/1.8),distance=4.55+widen*.75;
      return {eye:{x:p.x+f.x*distance+f.z*1.25,y:1.32+widen*.20,z:p.z+f.z*distance-f.x*1.25},
        target:{x:p.x,y:1.10,z:p.z},fov:34};
    }
    var midX=(p.x+s.ref.x)*.5,midZ=(p.z+s.ref.z)*.5,dx=s.ref.x-p.x,dz=s.ref.z-p.z,d=Math.hypot(dx,dz);
    return {eye:{x:midX-dz/d*4.5+dx*.18,y:1.53,z:midZ+dx/d*4.5+dz*.18},
      target:{x:midX,y:1.20,z:midZ},fov:37};
  }
};

/* ============================================================
   SUPER PILKA '98 · 08-rules.js — przepływ meczu i przepisy
   Stany: kickoff, play, throwin, goalkick, corner, freekick,
          penalty, goal, booking, replay, halftime, fulltime
   ============================================================ */
var RULES = {
  state: "menu",
  half: 1, elapsed: 0, displayMin: 0,
  restartTeam: 0, restartPos: {x:0,z:0}, taker: null,
  stateT: 0, celebT: 0,
  offsideSet: [], offsideArmTeam: -1,
  charge: -1, chargeKind: null, _charging: null,
  kickTeamFirst: 0,
  passPending: null,
  headerDone: false,
  lastFoulT: 0,

  /* ---------- start / restart meczu ---------- */
  newMatch: function(){
    this.half = 1; this.elapsed = 0; this.displayMin = 0;
    this.kickTeamFirst = 0;
    this.passPending=null; this.charge=-1; this._charging=null;this.lastScorer=null;
    BROADCAST.clear();REC.reset();
    SIM.resetMatch();
    HUD.refreshTeams();
    this.setupKickoff(0, true);
  },
  setupKickoff: function(team, first){
    this.state = "kickoff"; this.stateT = 0; REC.reset();
    this.restartTeam = team; this.restartPos = {x:0, z:0};
    var d0 = SIM.teams[team].dir;
    var available=SIM.teamPlayers(team).filter(function(p){return p.role!=="GK";});
    this.taker=available.find(function(p){return p.idx===9;})||available[available.length-1]||SIM.teamPlayers(team)[0];
    var support=available.find(function(p){return p.idx===10 && p!==RULES.taker;})||available.find(function(p){return p!==RULES.taker;});
    /* wszyscy do formacji */
    for(var i=0;i<SIM.players.length;i++){
      var pl = SIM.players[i];
      if(pl.off) continue;
      var dt2 = SIM.teams[pl.team].dir;
      var fx = pl.home.x*dt2, fz = pl.home.z*dt2;
      if(pl.team===team){
        if(pl===this.taker){ fx=-.13*dt2;fz=-.48*dt2; }
        else if(pl===support){ fx=-.64*dt2;fz=1.73*dt2; }
        else if(pl.role==="FW"){ fx = -2.5*dt2; fz = pl.home.z*dt2; }
      } else {
        /* przeciwnik: we własnej połowie, poza kołem środkowym */
        if(fx*dt2 > -9.6) fx = -9.6*dt2;
      }
      if(pl.team===team && pl!==this.taker) fx=Math.min(-.6,fx*dt2)*dt2;
      pl.pos.x = fx; pl.pos.z = fz; pl.vel.x = 0; pl.vel.z = 0;
      pl.face = Math.atan2(-fx, -fz) || 0;
      pl.moveTarget = null; pl.action = "run"; pl.actionT = 0;
    }
    var b = SIM.ball;
    b.x = 0; b.z = 0; b.y = SIM.BR; b.vx = b.vy = b.vz = 0; b.curve = 0;
    b.owner = null; b.lastTouchTeam = -1; b.lastKicker = null;
    this.offsideSet = []; this.offsideArmTeam = -1;
    this.assignTakerControl();
    AI.frozen = true;
    AUDIO.whistle(first ? 1 : 1);
    if(first && WORLD.teleMsg) WORLD.teleMsg(t("tv_kick"), 3.5);
    HUD.restartTagShow(t("rst_kick"));
    HUD.event("kickoff",t("friendly"),t(this.half===1?"first_half":"second_half"),SET.home,SET.away);
    this.hintFor(team, "hint_kick");
    HUD.commentary(first ? tPick("c_kick") : "");
  },
  teamName: function(team){ return team===0 ? SET.home : SET.away; },

  /* czy wykonawca wznowienia jest sterowany przez człowieka (zależnie od trybu) */
  humanTaker: function(team){
    if(SET.mode===2) return false;                 /* oglądanie: tylko AI */
    if(SET.mode===0 && team!==0) return false;     /* 1 gracz: gość to komputer */
    return true;
  },
  hintFor: function(team, key){
    var pad=INPUT.padSeen[team];
    HUD.hint(this.humanTaker(team)?t(key).replace("{T}",this.teamName(team))
      .replace("{A}",pad?"A / ✕":team===0?"K":",").replace("{B}",pad?"B / ◯":team===0?"L":"."):t("hint_cpu"));
  },

  assignTakerControl: function(){
    this.runUp=null;
    this.charge=-1;this._charging=null;this.passPending=null;this.headerDone=false;
    SIM.events.length=0;
    var b=SIM.ball;b.receiver=null;b.route=null;b.lock=0;b.flight="";b.shotTeam=null;b.lastShotBy=null;b.live=false;
    for(var i=0;i<SIM.players.length;i++){
      var p=SIM.players[i];p.moveTarget=null;p.closeControl=false;p.runT=0;p.vel.x=p.vel.z=0;
      if(!p.off){
        p.action="run";p.actionT=0;
        p.face=Math.atan2(this.restartPos.x-p.pos.x,this.restartPos.z-p.pos.z);
      }
    }
    if(this.taker){
      var dir=SIM.dirX(this.restartTeam),spot=this.restartPos;
      var tx=dir*HL,tz=0;
      if(this.state==="corner")tx=dir*(HL-10.5);
      if(this.state==="goalkick"){tx=0;tz=spot.z;}
      if(this.state==="throwin"){tx=spot.x+dir*4;tz=spot.z-Math.sign(spot.z)*9;}
      if(this.state==="kickoff"){
        var partner=this.nearestOutfield(this.restartTeam,this.taker.pos,false);
        if(partner){tx=partner.pos.x;tz=partner.pos.z;}
      }
      this.aimBase=Math.atan2(tx-spot.x,tz-spot.z);this.aimOffset=0;
      this.taker.face=this.aimBase;
      if(["corner","freekick","goalkick","penalty"].includes(this.state)){
        var behind=this.state==="penalty"?1.45:.67;
        this.taker.pos.x=spot.x-Math.sin(this.aimBase)*behind;
        this.taker.pos.z=spot.z-Math.cos(this.aimBase)*behind;
      }
    }
    if(!this.humanTaker(this.restartTeam)) return; /* CPU wykonuje sam — bez slotu gracza */
    var slot = this.restartTeam;   // P1 = drużyna 0, P2 = drużyna 1
    if(this.taker)SIM.control(slot,this.taker);
  },
  clearTakerControl: function(){
    if(this.taker && SIM.teams[this.taker.team].user===this.taker)SIM.control(this.taker.team,null);
  },

  /* ---------- wznowienia ---------- */
  setupThrow: function(team, x, z){
    this.state = "throwin"; this.stateT = 0;
    this.restartTeam = team;
    this.restartPos = { x: Math.max(-HL+1, Math.min(HL-1, x)), z: z > 0 ? HW : -HW };
    var b = SIM.ball;
    b.x = this.restartPos.x; b.z = this.restartPos.z; b.y = 1.7;
    b.vx = b.vy = b.vz = 0; b.owner = null; b.curve = 0;
    this.offsideSet = []; this.offsideArmTeam = -1;
    this.taker = this.nearestOutfield(team, this.restartPos, true);
    this.taker.pos.x = this.restartPos.x;
    this.taker.pos.z = this.restartPos.z + (z>0 ? -0.5 : 0.5);
    this.taker.vel.x = this.taker.vel.z = 0;
    this.taker.face = Math.atan2(-this.taker.pos.x, -this.taker.pos.z);
    this._pushOpponents(team, this.restartPos, 3);
    this.assignTakerControl();
    AI.frozen = true; this.headerDone = false;
    HUD.restartTagShow(t("rst_throw"));
    this.hintFor(team, "hint_throw");
    HUD.commentary(tPick("c_throw").replace("{T}", this.teamName(team)));
  },
  setupGoalkick: function(team, sideX){
    this.state = "goalkick"; this.stateT = 0;
    this.restartTeam = team;
    var dirX = SIM.teams[team].dir;
    this.restartPos = { x: -dirX*(HL-5.5), z: 0 };
    var b = SIM.ball;
    b.x = this.restartPos.x; b.z = 0; b.y = SIM.BR;
    b.vx = b.vy = b.vz = 0; b.owner = null; b.curve = 0;
    this.offsideSet = []; this.offsideArmTeam = -1;
    var gks = SIM.playersOf(team, "GK");
    this.taker = gks[0] || SIM.players[team*11];
    this.taker.pos.x = this.restartPos.x; this.taker.pos.z = 2;
    this._pushOpponents(team, this.restartPos, 10);
    this.assignTakerControl();
    AI.frozen = true; this.headerDone = false;
    HUD.restartTagShow(t("rst_goalkick"));
    this.hintFor(team, "hint_generic");
    HUD.commentary(tPick("c_gk").replace("{T}", this.teamName(team)));
  },
  setupCorner: function(team, sideX, sideZ){
    this.state = "corner"; this.stateT = 0;
    this.restartTeam = team;
    this.restartPos = { x: sideX*(HL-0.4), z: sideZ*(HW-0.4) };
    var b = SIM.ball;
    b.x = this.restartPos.x; b.z = this.restartPos.z; b.y = SIM.BR;
    b.vx = b.vy = b.vz = 0; b.owner = null; b.curve = 0;
    this.offsideSet = []; this.offsideArmTeam = -1;
    this.taker = this.nearestOutfield(team, this.restartPos, true);
    this.taker.pos.x = this.restartPos.x - Math.sign(sideX)*0.6;
    this.taker.pos.z = this.restartPos.z - Math.sign(sideZ)*0.6;
    SIM.teams[team].stats.corr++;
    this._boxCrowd(team, sideX);
    this._pushOpponents(team, this.restartPos, 9.15);
    this.assignTakerControl();
    AI.frozen = true; this.headerDone = false;
    HUD.restartTagShow(t("rst_corner"));
    this.hintFor(team, "hint_generic");
    HUD.commentary(tPick("c_corner"));
  },
  setupFree: function(team, x, z){
    this.state = "freekick"; this.stateT = 0;
    this.restartTeam = team;
    this.restartPos = { x: x, z: z };
    var b = SIM.ball;
    b.x = x; b.z = z; b.y = SIM.BR;
    b.vx = b.vy = b.vz = 0; b.owner = null; b.curve = 0;
    this.offsideSet = []; this.offsideArmTeam = -1;
    this.taker = this.nearestOutfield(team, this.restartPos, true);
    this.taker.pos.x = x; this.taker.pos.z = z + (z>0?-0.7:0.7);
    var dirX = SIM.teams[team].dir;
    var goalD = Math.hypot(dirX*HL-x, z);
    if(goalD < 30 && Math.abs(z) < 22){
      /* mur od 9.15 m */
      var gdx = dirX*HL-x, gdz = 0-z, gl = Math.hypot(gdx, gdz)||1;
      var opps = SIM.teamPlayers(1-team);
      opps = opps.filter(function(o){ return o.role!=="GK"; })
                .sort(function(a,c){
                  var da = Math.hypot(a.pos.x-x, a.pos.z-z), dc = Math.hypot(c.pos.x-x, c.pos.z-z);
                  return da-dc;
                });
      for(var w=0; w<Math.min(3, opps.length); w++){
        var o = opps[w];
        o.pos.x = x + gdx/gl*9.15 + (-gdz/gl)*(w-1)*1.1;
        o.pos.z = z + gdz/gl*9.15 + (gdx/gl)*(w-1)*1.1;
        o.moveTarget = null;
      }
    }
    this._pushOpponents(team, this.restartPos, 9.15);
    this.assignTakerControl();
    AI.frozen = true; this.headerDone = false;
    HUD.restartTagShow(t("rst_free"));
    this.hintFor(team, "hint_generic");
    HUD.commentary(tPick("c_free").replace("{T}", this.teamName(team)));
  },
  setupPenalty: function(team){
    this.state = "penalty"; this.stateT = 0;
    this.restartTeam = team;
    var dirX = SIM.teams[team].dir;
    this.restartPos = { x: dirX*(HL-11), z: 0 };
    var b = SIM.ball;
    b.x = this.restartPos.x; b.z = 0; b.y = SIM.BR;
    b.vx = b.vy = b.vz = 0; b.owner = null; b.curve = 0;
    this.offsideSet = []; this.offsideArmTeam = -1;
    var fws = SIM.playersOf(team, "FW");
    this.taker = fws[0] || this.nearestOutfield(team, this.restartPos, true);
    this.taker.pos.x = this.restartPos.x - dirX*3;
    this.taker.pos.z = 0;
    var gks = SIM.playersOf(1-team, "GK");
    if(gks[0]){ gks[0].pos.x = dirX*(HL-0.4); gks[0].pos.z = 0; }
    /* wszyscy przed piłką, poza polem karnym */
    for(var i=0;i<SIM.players.length;i++){
      var pl = SIM.players[i];
      if(pl.off || pl===this.taker || pl.role==="GK") continue;
      pl.pos.x = dirX*(HL-23) - dirX*Math.abs(pl.home.z)*0.3;
      pl.pos.z = pl.home.z*1.4;
      pl.vel.x = 0; pl.vel.z = 0;
      pl.moveTarget = null;
    }
    this.assignTakerControl();
    AI.frozen = true; this.headerDone = false;
    HUD.restartTagShow(t("rst_pen"));
    this.hintFor(team, "hint_pen");
    HUD.commentary(tPick("c_pen"));
    AUDIO.whistle(2);
    if(WORLD.teleMsg) WORLD.teleMsg(t("tv_pen").replace("{T}", this.teamName(team)), 4, "card");
  },
  nearestOutfield: function(team, pos, move){
    var ps = SIM.teamPlayers(team), best = null, bd = 1e9;
    for(var i=0;i<ps.length;i++){
      var pl = ps[i];
      if(pl.role==="GK" || (!move && pl===this.taker)) continue;
      var d = Math.hypot(pl.pos.x-pos.x, pl.pos.z-pos.z);
      if(d < bd){ bd = d; best = pl; }
    }
    return best;
  },
  _pushOpponents: function(team, pos, dist){
    var opps = SIM.teamPlayers(1-team);
    for(var i=0;i<opps.length;i++){
      var o = opps[i];
      if(o.role==="GK") continue;
      var dx = o.pos.x-pos.x, dz = o.pos.z-pos.z;
      var d = Math.hypot(dx, dz);
      if(d < dist){
        if(d < 0.01){ dx = 1; dz = 0; d = 1; }
        o.pos.x = pos.x + dx/d*dist;
        o.pos.z = pos.z + dz/d*dist;
        o.moveTarget = null;
      }
    }
  },
  _boxCrowd: function(team, sideX){
    var sideZ=Math.sign(this.restartPos.z)||1;
    var attack=SIM.teamPlayers(team).filter(function(p){return p.role!=="GK" && p!==RULES.taker;});
    var defence=SIM.teamPlayers(1-team).filter(function(p){return p.role!=="GK";});
    // Głębokość liczona od linii bramkowej i odchylenie względem bliższego słupka.
    var runs=[[5.2,3.3],[7.7,-3.1],[10.3,5.4],[12.8,-7.2],[15.7,.8]];
    attack.sort(function(p,q){return q.home.x-p.home.x;});
    defence.sort(function(p,q){return p.home.x-q.home.x;});
    runs.forEach(function(mark,i){
      var a=attack[i],d=defence[i];
      if(a){a.pos.x=sideX*(HL-mark[0]);a.pos.z=sideZ*mark[1];}
      if(d){d.pos.x=sideX*(HL-mark[0]+.65+(i%2)*.36);d.pos.z=sideZ*(mark[1]-.95+(i%2)*1.75);}
    });
    if(attack[5]){attack[5].pos.x=sideX*(HL-4.6);attack[5].pos.z=sideZ*(HW-6.1);}
    if(defence[5]){defence[5].pos.x=sideX*(HL-1.3);defence[5].pos.z=sideZ*3.05;}
  },

  /* ---------- zdarzenia z symulacji ---------- */
  onPass: function(pl, mate){
    var st = SIM.teams[pl.team].stats;
    st.attempt++;this.passPending = {team:pl.team,kicker:pl,t:5};
    /* armowanie spalonego (nie przy autach/rożnych/karnych/golach od bramki) */
    if(this.state==="play" || this.state==="freekick"){
      var dirX = SIM.teams[pl.team].dir;
      var ballX = SIM.ball.x*dirX;
      var defs = SIM.teamPlayers(1-pl.team);
      var xs = defs.map(function(d){ return d.pos.x*dirX; }).sort(function(a,b){ return b-a; });
      var secondLast = xs.length>1 ? xs[1] : -HL;
      this.offsideSet = [];
      for(var i=0;i<SIM.players.length;i++){
        var a = SIM.players[i];
        if(a.team!==pl.team || a.off || a===pl) continue;
        var ax = a.pos.x*dirX;
        if(ax > 0 && ax > ballX && ax > secondLast) this.offsideSet.push(a);
      }
      this.offsideArmTeam = pl.team;
    }
  },
  onShot: function(pl){
    this.passPending=null; SIM.teams[pl.team].stats.shots++;
    AUDIO.excitementSet(0.75);
  },
  onSave: function(gk, caught){
    if(SIM.ball.shotTeam===1-gk.team)SIM.teams[1-gk.team].stats.onT++;
    HUD.commentary(tPick("c_save"));
    AUDIO.excitementSet(0.8);
  },

  /* ---------- faule i kartki ---------- */
  checkTackles: function(dt){
    var ps = SIM.players, b = SIM.ball;
    for(var i=0;i<ps.length;i++){
      var tk = ps[i];
      if(tk.off || tk.action!=="slide" || tk.actionT < 0.12 || tk.actionT > 0.62) continue;
      for(var j=0;j<ps.length;j++){
        var v = ps[j];
        if(v.off || v.team===tk.team) continue;
        var d = Math.hypot(v.pos.x-tk.pos.x, v.pos.z-tk.pos.z);
        if(d < 1.0){
          var ballDist = Math.hypot(b.x-tk.pos.x, b.z-tk.pos.z);
          var clean = ballDist < 1.5;
          v.action = "fallen"; v.actionT = 1.0;
          if(clean){
            /* czysta odbiorka: piłka wybita */
            b.owner = null;
            var ang = Math.random()*6.28;
            SIM.kick(tk, Math.sin(ang), Math.cos(ang), 0.3, "clear");
            this._advantageNoise();
          } else {
            this.foul(tk, v);
          }
          tk.actionT = 0.12;
          return;
        }
      }
    }
  },
  _advantageNoise: function(){ AUDIO.kick(0.3); },
  foul: function(tk, victim){
    var st = SIM.teams[tk.team].stats;
    st.fouls++;
    var strict = REFSTRICT[SET.ref];
    AUDIO.whistle(2);
    AUDIO.fanWhistle(1);          /* trybuny gwizdzą po faulu */
    /* ocena karty */
    var fromBehind = (Math.sin(victim.face)*(tk.vel.x) + Math.cos(victim.face)*(tk.vel.z)) < -1.5;
    var lastMan = this._isLastMan(victim);
    var yelChance = 0.32*strict + (fromBehind?0.22*strict:0);
    var roll = Math.random();
    var cardMsg = null;
    if(lastMan && roll < 0.55*strict && tk.role!=="GK"){ cardMsg=this.giveCard(tk,"red"); }
    else if(roll < yelChance){ cardMsg=this.giveCard(tk,"yellow"); }
    HUD.commentary(tPick("c_foul") + (cardMsg ? " " + (cardMsg==="red" ? tPick("c_red") : tPick("c_yellow")) : ""));
    AUDIO.excitementSet(0.55);
    if(SIM.teamPlayers(tk.team).length<7){this.fullTime();return;}
    var dirX = SIM.teams[victim.team].dir;
    var inBox = (victim.pos.x*dirX > HL-16.5) && Math.abs(victim.pos.z) < 20.1 && (victim.pos.x*dirX < HL);
    if(cardMsg){
      this.state="booking";this.stateT=0;AI.frozen=true;
      BROADCAST.booking(tk,victim,cardMsg,inBox);return;
    }
    if(inBox){ this.setupPenalty(victim.team); }
    else { this.setupFree(victim.team, victim.pos.x, victim.pos.z); }
  },
  _isLastMan: function(att){
    var dirX = SIM.teams[att.team].dir;
    var defs = SIM.teamPlayers(1-att.team);
    var ahead = 0;
    for(var i=0;i<defs.length;i++){
      if(defs[i].role==="GK") continue;
      if(defs[i].pos.x*dirX > att.pos.x*dirX) ahead++;
    }
    var ax = att.pos.x*dirX;
    return ax > 0 && ahead <= 1 && Math.hypot(dirX*HL-att.pos.x, att.pos.z) < 30;
  },
  giveCard: function(pl, kind){
    if(kind==="yellow"){
      pl.yellows++;
      SIM.teams[pl.team].stats.yel++;
      if(pl.yellows >= 2) return this.giveCard(pl, "red");
      HUD.cardFlash(pl, false);
      if(WORLD.teleMsg) WORLD.teleMsg(t("tv_yel").replace("{N}", pl.num).replace("{T}", this.teamName(pl.team)), 4.5, "card");
    } else {
      pl.off=true;
      if(pl.role==="GK"){
        var standIn=SIM.teamPlayers(pl.team).find(function(p){return p.role==="DF";})||SIM.teamPlayers(pl.team)[0];
        if(standIn){
          standIn.emergencyGK=true;standIn.role="GK";standIn.home={x:-50,z:0};
          standIn.pos.x=pl.pos.x;standIn.pos.z=pl.pos.z;
          WORLD.removePlayer(standIn.mesh);
          standIn.mesh=WORLD.makePlayer(standIn.team,true,standIn.num,null,null,standIn.name);
        }
      }
      SIM.teams[pl.team].stats.red++;
      WORLD.removePlayer(pl.mesh); pl.mesh = null;
      HUD.cardFlash(pl, true);
      AUDIO.whistle(2);
      if(WORLD.teleMsg) WORLD.teleMsg(t("tv_red").replace("{N}", pl.num).replace("{T}", this.teamName(pl.team)), 5, "card");
    }
    return kind;
  },

  /* ---------- spalony ---------- */
  checkOffsideTouch: function(pl){
    if(this.offsideArmTeam !== pl.team) return false;
    var idx = this.offsideSet.indexOf(pl);
    if(idx < 0) return false;
    this.offsideSet = []; this.offsideArmTeam = -1;
    AUDIO.whistle(2);
    HUD.commentary(tPick("c_off"));
    HUD.banner(t("rst_free"), t("offside"), 1.4);
    if(WORLD.teleMsg) WORLD.teleMsg(t("tv_off"), 3, "info");
    var dirX = SIM.teams[pl.team].dir;
    this.setupFree(1-pl.team, pl.pos.x - dirX*1.5, pl.pos.z);
    return true;
  },

  /* ---------- gol ---------- */
  checkGoal: function(){
    var b = SIM.ball;
    if(Math.abs(b.z) < GOAL_W/2 && b.y < GOAL_H){
      if(b.x > HL + SIM.BR){
        var t0 = SIM.teams[0].dir > 0 ? 0 : 1;
        this._goal(t0); return true;
      }
      if(b.x < -HL - SIM.BR){
        var t1 = SIM.teams[0].dir < 0 ? 0 : 1;
        this._goal(t1); return true;
      }
    }
    return false;
  },
  _goal: function(team){
    SIM.teams[team].score++;
    STADIUM.goal(team);PITCH.hit(SIM.ball);
    this._goalTeam = team;this.stateT=0;
    this._lastConceded = 1-team;
    var last=SIM.ball.lastShotBy || SIM.ball.lastKicker;
    var scorer=last && last.team===team?last:null;
    var own=last && last.team!==team?last:null;
    if(scorer)scorer.goals++;
    if(SIM.ball.shotTeam===team)SIM.teams[team].stats.onT++;
    this.lastScorer=(scorer?scorer.name:own?own.name+" ("+t("own_goal")+")":t("goal_title"))+" · "+Math.min(90,this.displayMin+1)+"′";
    this.state="goal";this.celebT=3.9;AI.frozen=true;
    BROADCAST.goal(team,scorer,own);
    this.offsideSet = []; this.offsideArmTeam = -1;
    AUDIO.roar(1.2); AUDIO.horn(); AUDIO.whistle(1);
    AUDIO.excitementSet(1);

    HUD.commentary(tPick("c_goal"));
    HUD.setScore();
    if(WORLD.teleMsg) WORLD.teleMsg(t("tv_goal").replace("{M}", this.displayMin)
      .replace("{T}", this.teamName(team)).replace("{S}", SIM.teams[0].score + ":" + SIM.teams[1].score), 5, "goal");
    WORLD.aimArrow.visible = false;
  },

  /* ---------- auty / rożne / wykop ---------- */
  checkBounds: function(){
    var b = SIM.ball;
    if(Math.abs(b.z)>HW+SIM.BR){
      var team = b.lastTouchTeam===0 ? 1 : 0;
      if(b.lastTouchTeam < 0) team = Math.random()<0.5?0:1;
      this.setupThrow(team, b.x, b.z);
      return true;
    }
    if(Math.abs(b.x)>HL+SIM.BR){
      var side = Math.sign(b.x);
      var attacker = SIM.teams[0].dir===side ? 0 : 1;
      if(b.lastTouchTeam === attacker){
        this.setupGoalkick(1-attacker, side);
      } else {
        this.setupCorner(attacker, side, Math.sign(b.z)||1);
      }
      return true;
    }
    return false;
  },

  /* ---------- wykonywanie wznowień przez człowieka / AI ---------- */
  startRestart:function(kind,power,automatic){
    if(!["corner","goalkick","freekick","penalty"].includes(kind)){
      this.execRestart(kind,power,automatic);return;
    }
    var p=this.taker,b=SIM.ball,dx=Math.sin(p.face),dz=Math.cos(p.face);
    var foot=p.mesh.userData.kickLeg===0?-1:1;
    var contactX=b.x-dx*.32-dz*foot*.085,contactZ=b.z-dz*.32+dx*foot*.085;
    this.runUp={kind:kind,power:power,automatic:automatic,x:p.pos.x,z:p.pos.z,
      endX:contactX,endZ:contactZ,t:0,length:kind==="penalty"?.42:.20};
    p.action="run";HUD.showPower(null);WORLD.aimArrow.visible=false;
  },
  approachRestart:function(dt){
    var run=this.runUp,p=this.taker;
    run.t=Math.min(run.length,run.t+dt);
    var t=run.t/run.length,weight=t*t*(3-2*t);
    var x=run.x+(run.endX-run.x)*weight,z=run.z+(run.endZ-run.z)*weight;
    p.vel.x=(x-p.pos.x)/dt;p.vel.z=(z-p.pos.z)/dt;p.pos.x=x;p.pos.z=z;
    if(t<1)return;
    p.vel.x=p.vel.z=0;this.runUp=null;this.execRestart(run.kind,run.power,run.automatic);
  },
  execRestart: function(kind, power, automatic){
    var pl = this.taker, team = this.restartTeam;
    var b = SIM.ball;
    var dirX = SIM.teams[team].dir;
    var manual=pl.isUser!==null && !automatic;
    var aim=manual?{x:Math.sin(pl.face),z:Math.cos(pl.face)}:null;
    this.clearTakerControl();
    AI.frozen = false;
    if(kind==="kickoff"){
      var mate = this.nearestOutfield(team,pl.pos,false);
      if(mate && mate!==pl){
        SIM.deliver(pl,mate,"pass",.3,dirX,0);
      } else {
        SIM.kick(pl, dirX, 0.2, 0.4, "pass");
      }
    }
    else if(kind==="throw"){
      var near=this.nearestOutfield(team,pl.pos,false);
      var a2=aim || (near?{x:near.pos.x-pl.pos.x,z:near.pos.z-pl.pos.z}:{x:dirX,z:-Math.sign(pl.pos.z)});
      a2={x:a2.x,z:-Math.sign(pl.pos.z)*Math.max(.38,Math.abs(a2.z))};
      SIM.throwBall(pl, a2.x, a2.z, Math.max(0.2, power||0.4));
      this.onPass(pl,null);
    }
    else if(kind==="goalkick"){
      if(power!==undefined && power>0.05){ /* B: długie */
        SIM.kick(pl, aim?aim.x:dirX*.9, aim?aim.z:(Math.random()*2-1)*.35, Math.max(0.5,power), "gklong");
      } else {
        var df=aim?SIM.pickPassTarget(team,aim.x,aim.z,false,pl):this.nearestOutfield(team,pl.pos,false);
        if(df) SIM.deliver(pl,df,"pass",.5,dirX,0);
        else SIM.kick(pl, dirX, 0, 0.7, "gklong");
      }
    }
    else if(kind==="corner"){
      var sideX = Math.sign(pl.pos.x||1), sideZ = Math.sign(pl.pos.z||1);
      if(power!==undefined && power>0.05){
        var box=SIM.teamPlayers(team).filter(function(p){return p!==pl && p.role!=="GK";});
        box.sort(function(a,c){return Math.hypot(a.pos.x-sideX*(HL-10),a.pos.z)-Math.hypot(c.pos.x-sideX*(HL-10),c.pos.z);});
        if(aim){
          var target={x:b.x+aim.x*(22+16*power),z:b.z+aim.z*(22+16*power)};
          box.sort(function(p,q){return Math.hypot(p.pos.x-target.x,p.pos.z-target.z)-Math.hypot(q.pos.x-target.x,q.pos.z-target.z);});
          SIM.deliver(pl,box[0]||null,"cross",power,aim.x,aim.z,target);
        }else SIM.deliver(pl,box[0]||null,"cross",power,-sideX*.4,-sideZ);
      } else {
        var mate2=aim?SIM.pickPassTarget(team,aim.x,aim.z,false,pl):this.nearestOutfield(team,pl.pos,false);
        if(mate2){
          SIM.deliver(pl,mate2,"pass",.4,dirX,0);
        } else {
          SIM.kick(pl, sideX*-1, -sideZ*0.6, 0.8, "cross");
          SIM.ball.curve = -sideZ*2.0;
        }
      }
    }
    else if(kind==="freekick"){
      var goalD = Math.hypot(dirX*HL-pl.pos.x, pl.pos.z);
      if(power!==undefined && power>0.05){
        if(goalD < 32 && Math.abs(pl.pos.z) < 24){
          var tz2 = (Math.random()*2-1)*1.2;
          SIM.kick(pl, aim?aim.x:dirX*HL-pl.pos.x, aim?aim.z:tz2-pl.pos.z, Math.min(1,power), "shot");
          SIM.ball.curve = -Math.sign(pl.pos.z||1)*2.4;
          this.onShot(pl);
        } else {
          SIM.kick(pl, aim?aim.x:dirX, aim?aim.z:(Math.random()*2-1)*.5, Math.max(.6,power), "clear");
        }
      } else {
        var mate3=aim?SIM.pickPassTarget(team,aim.x,aim.z,false,pl):this.nearestOutfield(team,pl.pos,false);
        if(mate3) SIM.deliver(pl,mate3,"pass",.5,dirX,0);
        else SIM.kick(pl, dirX, 0, 0.7, "pass");

      }
    }
    else if(kind==="penalty"){
      /* karny: celowanie gałką w szerokość, siła = wysokość */
      var high=Math.min(1,power||.6);
      var tz3=aim?11*aim.z/Math.max(.1,Math.abs(aim.x)):(Math.random()*2-1)*3.25;
      var gk = SIM.playersOf(1-team, "GK")[0];
      var dive = (Math.random()<0.78 ? Math.sign(tz3||1) : -Math.sign(tz3||1)) * (1.6+Math.random()*1.6);
      SIM.kick(pl, dirX*HL-b.x, tz3-b.z, .85, "shot");
      SIM.ball.vy = 1.2 + high*3.2;
      SIM.ball.vx *= 0.92; SIM.ball.vz *= 0.92;
      if(gk){gk.moveTarget={x:gk.pos.x,z:dive,sprint:true};gk.challengeCd=.06;}
      this.onShot(pl);
    }
    HUD.restartTagHide();
    HUD.hideEvent();HUD.hint("");
    HUD.showPower(null);
    WORLD.aimArrow.visible = false;
    this.charge = -1; this._charging = null;
    this.state = "play";
    this.headerDone = false;
    b.live = true;
  },

  /* ---------- AI wykonuje wznowienie ---------- */
  aiRestart: function(){
    var kind = this.state, pl = this.taker;
    if(!pl || pl.off){ this.startRestart("kickoff", 0.3, true); return; }
    var r = Math.random();
    if(kind==="kickoff") this.startRestart("kickoff", 0.3, true);
    else if(kind==="throwin") this.startRestart("throw", 0.35+Math.random()*0.3, true);
    else if(kind==="goalkick") this.startRestart("goalkick", r<0.5 ? 0 : 0.8, true);
    else if(kind==="corner") this.startRestart("corner", r<0.25 ? 0 : 0.55+Math.random()*0.35, true);
    else if(kind==="freekick") this.startRestart("freekick", r<0.4 ? 0 : 0.6+Math.random()*0.4, true);
    else if(kind==="penalty") this.startRestart("penalty", 0.45+Math.random()*0.4, true);
  },

  /* ---------- nagłówki (dośrodkowania) ---------- */
  checkHeader: function(){
    if(this.headerDone) return;
    var b = SIM.ball;
    if(b.owner || b.flight!=="cross" || b.y<1.15 || b.y>2.55 || b.vy>1.5) return;
    if(Math.hypot(b.vx, b.vz) < 6) return;
    var dirSide = Math.sign(b.x)||1;
    if(Math.abs(b.x) < HL-18) return;
    var atk = null, def = null, abd = 1e9, dbd = 1e9;
    for(var i=0;i<SIM.players.length;i++){
      var pl = SIM.players[i];
      if(pl.off) continue;
      if(pl.role==="GK" || (pl===b.lastKicker && b.lock>0))continue;
      var d = Math.hypot(pl.pos.x-b.x, pl.pos.z-b.z);
      if(d < 1.7){
        if(pl.team === (SIM.teams[0].dir===dirSide ? 0 : 1)){ if(d<abd){ abd=d; atk=pl; } }
        else { if(d<dbd){ dbd=d; def=pl; } }
      }
    }
    if(atk && (!def || abd <= dbd)){
      this.headerDone = true;
      var gdir = dirSide;
      var tz = (Math.random()*2-1)*2.8;
      if(this.checkOffsideTouch(atk))return;
      if(this.passPending && this.passPending.team===atk.team && this.passPending.kicker!==atk)SIM.teams[atk.team].stats.pass++;
      SIM.kick(atk, gdir*HL-atk.pos.x, tz-atk.pos.z, 0.55, "header");
      SIM.ball.vy = 1.6;
      this.onShot(atk);
      HUD.commentary(t("c_header"));
    } else if(def){
      this.headerDone = true;
      var ang = Math.random()*6.28;
      SIM.kick(def, Math.sin(ang), Math.cos(ang), 0.7, "clear");
    }
  },

  /* ---------- główna aktualizacja zasad ---------- */
  update: function(dt){
    var b = SIM.ball;
    this.stateT += dt;
    if(this.passPending){
      this.passPending.t -= dt;
      if(this.passPending.t <= 0) this.passPending = null;
    }

    var skip=INPUT.slots[0].camP || INPUT.slots[1].camP;
    if(this.state==="booking"){
      BROADCAST.bookingStep(dt);
      if(this.stateT>=2.9 || skip){
        var spot=BROADCAST.scene.restart;
        BROADCAST.clear();
        if(spot.penalty)this.setupPenalty(spot.team);
        else this.setupFree(spot.team,spot.x,spot.z);
      }
      return;
    }
    if(this.state==="goal"){
      BROADCAST.goalStep(dt,this.stateT);
      this.celebT=skip?0:this.celebT-dt;
      if(this.celebT <= 0){
        BROADCAST.clear();this.clearTakerControl();
        /* po golu: powtórka akcji (jeśli mamy materiał), potem wznowienie */
        if(REC.canReplay() && REPLAY.begin()){
          this.state = "replay";
        } else {
          this.setupKickoff(this._lastConceded, false);
        }
      }
      return;
    }
    if(this.state==="replay"){
      if(REPLAY.update(dt)) this.setupKickoff(this._lastConceded, false);
      return;
    }
    if(this.state==="halftime"){
      if(this.stateT > 3.0){
        this.half = 2;
        SIM.teams[0].dir *= -1; SIM.teams[1].dir *= -1;
        this.elapsed = 0;
        this.setupKickoff(1-this.kickTeamFirst, false);
      }
      return;
    }
    if(this.state==="fulltime") return;

    /* wznowienia oczekujące na wykonanie */
    if(this.state!=="play"){
      if(this.runUp){this.approachRestart(dt);return;}
      if(this.taker && !b.owner){
        /* piłka trzymana/przy zawodniku */
        if(this.state==="throwin"){
          b.x = this.taker.pos.x + Math.sin(this.taker.face)*0.35;
          b.z = this.taker.pos.z + Math.cos(this.taker.face)*0.35;
          b.y = 1.7;
        } else {
          b.x=this.restartPos.x;b.z=this.restartPos.z;
          b.y = SIM.BR;
        }
        b.vx = b.vy = b.vz = 0;
      }
      /* człowiek wykonuje */
      if(this.taker && this.taker.isUser!==null){
        var slot = this.taker.isUser;
        var inp = INPUT.slots[slot];
        /* zabezpieczenie: bezczynny człowiek nie blokuje meczu (karny — dłużej, bo celowanie) */
        if(this.stateT > (this.state==="penalty" ? 12 : 7)){ this.aiRestart(); return; }
        var aimed=["penalty","corner","freekick","goalkick"].includes(this.state);
        if(aimed){
          var limit=this.state==="penalty"?.35:this.state==="corner"?.58:1.03;
          this.aimOffset=Math.max(-limit,Math.min(limit,this.aimOffset-inp.mx*dt*(this.state==="penalty"?.53:1.5)));
          this.taker.face=this.aimBase+this.aimOffset;
        }else if(this.state==="throwin" && inp.moveLen>.3){
          var field=CAM.fieldInput(inp.mx,inp.mz);
          this.taker.face=Math.atan2(field.x,-Math.sign(this.restartPos.z)*Math.max(.38,Math.abs(field.z)));
        }
        WORLD.aimArrow.visible=aimed;
        WORLD.aimArrow.position.set(this.restartPos.x,.04,this.restartPos.z);
        WORLD.aimArrow.rotation.y=this.taker.face;
        if(this.state==="penalty" || this.state==="corner" || this.state==="freekick" || this.state==="goalkick"){
          if(inp.shoot){ this.charge = Math.min(1, (this.charge<0?0:this.charge)+dt/0.9); HUD.showPower(this.charge); this._charging = "B"; }
          else if(this._charging==="B" && !inp.shoot){ var pw = Math.max(0.15, this.charge); this.charge = -1; this._charging = null; HUD.showPower(null); this.startRestart(this.state, pw); return; }
          if(inp.passP && this.state!=="penalty"){ this.charge = -1; this._charging = null; HUD.showPower(null); this.startRestart(this.state, 0); return; }
        } else if(this.state==="throwin"){
          if(inp.pass){ this.charge = Math.min(1, (this.charge<0?0:this.charge)+dt/0.8); HUD.showPower(this.charge); this._charging="A"; }
          else if(this._charging==="A" && !inp.pass){ var pw2 = Math.max(0.15, this.charge); this.charge=-1; this._charging=null; HUD.showPower(null); this.startRestart("throw", pw2); return; }
        } else if(this.state==="kickoff"){
          if(inp.passP){ this.startRestart("kickoff", 0.3); return; }
        }
      } else {
        /* AI czeka chwilę i wykonuje */
        WORLD.aimArrow.visible = false;
        if(this.stateT > (this.state==="penalty" ? 1.6 : 1.1)) this.aiRestart();
      }
      return;
    }

    /* ============ GRA WLASCIWA ============ */
    this.elapsed += dt;
    this.displayMin = Math.min(45, Math.floor(this.elapsed / SET.half * 45)) + (this.half===2 ? 45 : 0);
    if(b.owner) SIM.teams[b.owner.team].stats.poss += dt;
    else if(b.lastTouchTeam >= 0) SIM.teams[b.lastTouchTeam].stats.poss += dt*0.4;

    AI.frozen = false;
    this.checkTackles(dt);
    if(this.state!=="play")return;
    this.checkHeader();
    if(this.state!=="play")return;

    /* zdarzenia styku: spalony, podania */
    for(var e=0;e<SIM.events.length;e++){
      var ev = SIM.events[e];
      if(ev.type==="touch"){
        var tp = ev.player;
        if(this.checkOffsideTouch(tp)){ SIM.events.length=0;return; }
        if(this.passPending && tp.team===this.passPending.team && tp!==this.passPending.kicker)
          SIM.teams[tp.team].stats.pass++;
        this.passPending=null;this.offsideSet=[];this.offsideArmTeam=-1;
        AUDIO.excitementSet(Math.max(0.2, 0.5 - Math.abs(tp.pos.x)*0.006));
      }
      else if(ev.type==="post"){
        HUD.commentary(tPick("c_post"));
        AUDIO.excitementSet(0.85);
      }
    }
    SIM.events.length = 0;

    /* gol / auty */
    if(this.checkGoal()) return;
    if(this.checkBounds()) return;

    /* koniec połowy */
    if(this.elapsed >= SET.half){
      if(this.half===1){
        this.state = "halftime"; this.stateT = 0;
        AUDIO.whistle(2);
        HUD.banner(t("half_title"), SET.home + "  " + SIM.teams[0].score + " : " + SIM.teams[1].score + "  " + SET.away, 3.0);
        HUD.commentary(tPick("c_half"));
        HUD.showPower(null);
        if(WORLD.teleMsg) WORLD.teleMsg(t("tv_half") + "  " + SIM.teams[0].score + " : " + SIM.teams[1].score, 4, "info");
      } else {
        this.fullTime();
      }
    }
  },
  fullTime: function(){
    this.state = "fulltime";
    AUDIO.whistle(4);
    HUD.showEnd();
    if(WORLD.teleMsg) WORLD.teleMsg(t("tv_full") + "  " + SIM.teams[0].score + " : " + SIM.teams[1].score, 8, "info");
  },
  _goalTeam: -1,
  _lastConceded: 0
};
