/* ============================================================
   SUPER POLKA '98 · 09-cam.js — kamery, reżyser, powtórki
   0: TV 2000 · 1: Góra '98 · 2: Za piłką
   • TV: adaptacyjny kadr — prowadzenie piłki z wyprzedzeniem,
     auto-cofnięcie i uniesienie przy autowej bandzie (piłka zawsze
     widoczna także przy wrzucie z autu), najazd przy polu karnym.
   • Cięcia reżysera: kick-off (koło środkowe), gol (zbliżenie
     z najazdem), karny (najazd podczas celowania), rożny (kąt z rogu).
   • POWTÓRKA: REC buforuje ~6 s gry (16 Hz), po golu REPLAY odtwarza
     akcję w zwolnionym tempie kinową kamerą (plan z trybuny + plan
     zza akcji z najazdem na bramkę), letterbox + znacznik w HUD.
   ============================================================ */
var CAM = {
  pos: { x:0, y:30, z:52 },
  look: { x:0, y:0, z:0 },
  fov: 38,
  menuAngle: 0,
  modeNames: ["TV", "TOP", "BEHIND","PLAYER"],
  _last: null,

  /* interaktywne zbliżenie: 1 = Neutralne; <1 najazd, >1 odjazd.
     Kółko myszy / klawisze + − (patrz INPUT + MAIN); zastosowane w trybach
     TV / Góra / Za piłką — kadry reżysera (gol, karny, rożny, intro) bez zmian. */
  zoom: 1, zoomT: 1,
  zoomBy: function(f){
    this.zoomT = Math.max(0.5, Math.min(2.4, this.zoomT + f));
  },

  setMode: function(m){ SET.cam = ((m%4)+4)%4; },
  fieldInput:function(mx,mz){
    var fx=this.look.x-this.pos.x,fz=this.look.z-this.pos.z,mag=Math.hypot(fx,fz)||1;
    fx/=mag;fz/=mag;
    return {x:-fz*mx-fx*mz,z:fx*mx-fz*mz};
  },

  update: function(dt, state){
    if(state === "replay") return;            /* kadr prowadzi REPLAY */
    var b = SIM.ball;
    var des = { x:0, y:30, z:52 }, look = { x:0, y:0, z:0 }, fov = 38;
    var m = SET.cam|0;
    var snap = false;
    var zoomable = false;          /* true tylko w trybach gracza (TV/TOP/BEHIND) */
    if(this._last !== state){
      var cuts=["kickoff","goal","booking","corner","penalty","goalkick","freekick"];
      snap=cuts.includes(state) || (state==="play" && cuts.includes(this._last));
      this._last=state;
    }
    var aspect=WORLD.cam.aspect || 16/9;
    var narrow=Math.max(1,Math.min(1.50,1.36/aspect));
    if((state==="goal" || state==="booking") && BROADCAST.scene){
      var shot=BROADCAST.shot(RULES.stateT);
      des=shot.eye;look=shot.target;fov=shot.fov+(narrow-1)*17;
    }
    else if(state==="kickoff"){
      des={x:-1.1,y:15.8*narrow,z:23.8*narrow};
      look={x:0,y:.2,z:0};fov=40;
    }
    else if(state==="menu"){
      this.menuAngle += dt*.055;
      des={x:18+Math.sin(this.menuAngle)*12,y:15,z:35+Math.cos(this.menuAngle)*4};
      look={x:-8,y:4,z:-17};
      fov = 42;
    }
    else if(m===0){
      zoomable=true;
      var attack=b.owner?SIM.dirX(b.owner.team):b.lastTouchTeam>=0?SIM.dirX(b.lastTouchTeam):0;
      var lead=Math.max(-4.5,Math.min(4.5,b.vx*.23+attack*1.5));
      var lx=Math.max(-HL+.7,Math.min(HL-.7,b.x+lead));
      var lz=Math.max(-HW,Math.min(HW,b.z+b.vz*.14));
      var lob=Math.min(2.4,Math.max(0,b.y-1)*.45);
      var box=Math.max(0,(Math.abs(b.x)-30)/(HL-30));
      // Przy bliższej linii operator unosi kamerę nad pierwszymi rzędami.
      des={x:lx*.88,y:(16.5+Math.max(0,b.z-8)*.33+lob)*narrow,z:lz+(27.4-box*2)*narrow};
      look={x:lx,y:.36+lob*.54,z:lz};fov=40-box*2.4;
    }
    else if(m===1){ /* Góra '98 */
      zoomable = true;
      des = { x: Math.max(-14, Math.min(14, b.x*0.28)), y: 94, z: Math.max(-8, Math.min(8, b.z*0.24)) + 12 };
      look = { x: Math.max(-26, Math.min(26, b.x*0.5)), y: 0, z: Math.max(-16, Math.min(16, b.z*0.42)) };
      fov = 45;
    }
    else if(m===2){ /* Za piłką */
      zoomable = true;
      var d = SIM.teams[0].dir;
      des = { x: b.x - d*11, y: 7.5 + Math.max(0, b.z)*0.16, z: Math.max(-33, Math.min(33, b.z*0.8)) };
      look = { x: b.x + d*15, y: 0.8, z: Math.max(-32, Math.min(32, b.z*0.9)) };
      var gpush = Math.max(0, (Math.abs(b.x) - 30) / 22);
      fov = 52 - gpush*6;
    }
    else { // Niski kadr zza barku pozwala oglądać pracę nóg w trakcie gry.
      zoomable=true;
      var tracked=SIM.teams[0].user || b.owner || SIM.nearestToBall(b.lastTouchTeam===1?1:0,true);
      var dir=SIM.dirX(tracked.team),px=tracked.pos.x,pz=tracked.pos.z;
      des={x:px-dir*5.6,y:2.45,z:pz+dir*1.25};
      look={x:px+dir*4.6,y : 0.92,z:pz+Math.max(-2,Math.min(2,(b.z-pz)*.22))};
      fov=55;
    }
    if(state==="penalty" || state==="goalkick"){
      var dir=SIM.dirX(RULES.restartTeam);
      zoomable=false;
      if(state==="goalkick"){
        var back=4.55;
        des={x:b.x-dir*back,y:1.68+(narrow-1)*.36,z:dir*.68};
        look={x:b.x+dir*12,y:.48,z:0};fov=45+(narrow-1)*16;
      }else{
        des={x:b.x-dir*7.1*narrow,y:3.1*narrow,z:dir*1.25};
        look={x:b.x+dir*7.2,y:.65,z:0};fov=42+(narrow-1)*12;
      }
    }else if(state==="corner" || (state==="freekick" && m===0)){
      zoomable=false;
      var c=RULES.restartPos, angle=RULES.aimBase;
      var sx=Math.sin(angle),sz=Math.cos(angle),corner=state==="corner";
      if(corner){
        // Operator stoi wewnątrz bariery narożnej. W wąskim oknie patrzy bliżej wykonawcy.
        des={x:c.x-Math.sign(c.x)*3.35,y:3.6+(narrow-1)*.8,z:c.z+Math.sign(c.z)*5};
        var aimShare=Math.min(.85,Math.max(.18,(aspect-.40)*.82));
        var rayX=(c.x-des.x)/6.02,rayZ=(c.z-des.z)/6.02;
        look={x:c.x+5.8*(rayX+(sx-rayX)*aimShare),y:.36,z:c.z+5.8*(rayZ+(sz-rayZ)*aimShare)};
        fov=52+(narrow-1)*13;
      }else{
        des={x:c.x-sx*7.5+sz*.75,y:3.6*narrow,z:c.z-sz*7.5-sx*.75};
        look={x:c.x+sx*10,y:.38,z:c.z+sz*10};fov=45+(narrow-1)*13;
      }
    }

    /* zoom interaktywny — skala odległości kamera→punkt celowania
       (tylko tryby TV/TOP/BEHIND; kadry reżysera zostają bez zmian) */
    this.zoom += (this.zoomT - this.zoom) * Math.min(1, dt*7);
    if(zoomable){
      des.x = look.x + (des.x - look.x)*this.zoom;
      des.y = look.y + (des.y - look.y)*this.zoom;
      des.z = look.z + (des.z - look.z)*this.zoom;
    }

    if(snap){
      this.pos.x=des.x; this.pos.y=des.y; this.pos.z=des.z;
      this.look.x=look.x; this.look.y=look.y; this.look.z=look.z;
      this.fov=fov;
    } else {
      var kp = Math.min(1, dt*3.4), kl = Math.min(1, dt*5.2), kf = Math.min(1, dt*3);
      this.pos.x += (des.x-this.pos.x)*kp;
      this.pos.y += (des.y-this.pos.y)*kp;
      this.pos.z += (des.z-this.pos.z)*kp;
      this.look.x += (look.x-this.look.x)*kl;
      this.look.y += (look.y-this.look.y)*kl;
      this.look.z += (look.z-this.look.z)*kl;
      this.fov += (fov-this.fov)*kf;
    }

    WORLD.cam.position.set(this.pos.x, this.pos.y, this.pos.z);
    WORLD.cam.lookAt(this.look.x, this.look.y, this.look.z);
    if(Math.abs(WORLD.cam.fov - this.fov) > 0.05){
      WORLD.cam.fov = this.fov;
      WORLD.cam.updateProjectionMatrix();
    }
  }
};

/* ============ NAGRYWANIE AKCJI — bufor kołowy ~16 Hz ============ */
var REC = {
  buf: [], acc: 0, span: 0,
  stride:8, actions:["run","slide","kick","fallen","celebrate","throw","standtackle","dive","header","passkick","crosskick","jockey","windup","keeperhold","passload"],
  STEP: 0.062,             /* ~16 klatek nagrania na sekundę */
  MAX: 7.0,                /* ile sekund wstecz trzymać */

  reset: function(){ this.buf.length = 0; this.acc = 0; this.span = 0; },

  push: function(dt){
    this.acc += dt;
    if(this.acc < this.STEP) return;
    this.acc -= this.STEP;
    var ps = SIM.players, n = ps.length;
    var p=new Float32Array(n*this.stride);
    for(var i=0;i<n;i++){
      var pl=ps[i],o=i*this.stride;
      p[o]=pl.pos.x;p[o+1]=pl.pos.z;p[o+2]=pl.face;p[o+3]=Math.max(0,this.actions.indexOf(SIM.visualAction(pl)));
      p[o+4]=pl.actionT;p[o+5]=Math.hypot(pl.vel.x,pl.vel.z);p[o+6]=pl.stridePhase;p[o+7]=pl.diveSide;
    }
    var b = SIM.ball;
    this.span += this.STEP;
    this.buf.push({ t: this.span, bx: b.x, by: b.y, bz: b.z, bvx: b.vx, bvz: b.vz, p: p });
    while(this.buf.length > 2 && this.buf[this.buf.length-1].t - this.buf[0].t > this.MAX)
      this.buf.shift();
  },

  canReplay: function(){
    if(this.buf.length < 20) return false;
    var t1 = this.buf[this.buf.length-1].t;
    for(var i=0;i<this.buf.length;i++)
      if(t1 - this.buf[i].t >= 3.4) return true;    /* minimum ~3,5 s materiału */
    return false;
  },

  frames: function(){
    var t1 = this.buf[this.buf.length-1].t, out = [];
    for(var i=0;i<this.buf.length;i++)
      if(t1 - this.buf[i].t <= 6.0) out.push(this.buf[i]);
    return out;
  }
};

/* ============ POWTÓRKA — kinowa reżyseria po golu ============ */
var REPLAY = {
  active: false, t: 0, dur: 5, fr: null, f0: 0,
  goalDir: 1, side: 1, _prev: null, _dt: 0.016,

  SPEED: 0.8,              /* tempo odtwarzania (0.8 = lekkie zwolnienie) */

  begin: function(){
    var fr = REC.frames();
    if(!fr || fr.length < 14){ this.active = false; return false; }
    this.fr = fr;
    this.f0 = fr[0].t;
    var span = fr[fr.length-1].t - fr[0].t;
    this.dur = span / this.SPEED;
    this.t = 0;
    this.goalDir = fr[fr.length-1].bx > 0 ? 1 : -1;   /* do której bramki wpadła */
    this.side = fr[fr.length-1].bz >= 0 ? 1 : -1;     /* kamera z drugiej połowy szerokości */
    this._prev = null;
    this.active = true;
    HUD.replayUI(true);
    HUD.commentary(tPick("c_rep"));
    WORLD.crowdPulse = 0.35;
    AUDIO.excitementSet(0.5);
    this._apply(this.f0);
    return true;
  },

  /* zwraca true, gdy powtórka się skończyła */
  update: function(dt){
    if(!this.active) return true;
    if(INPUT.slots[0].camP || INPUT.slots[1].camP){ this.finish(); return true; }
    this._dt = Math.min(0.05, dt);
    this.t += dt;
    var ft = this.f0 + this.t*this.SPEED;
    if(ft >= this.fr[this.fr.length-1].t){ this.finish(); return true; }
    this._apply(ft);
    this._cam();
    return false;
  },

  finish: function(){
    this.active = false;
    HUD.replayUI(false);
    SIM.syncMeshes(0);            /* natychmiastowy powrót do realnych pozycji */
  },

  _actStr: ["run","slide","kick","fallen","celebrate"],

  _apply: function(ft){
    var fr = this.fr, i = 0;
    while(i < fr.length-1 && fr[i+1].t < ft) i++;
    var a = fr[i], b2 = fr[Math.min(fr.length-1, i+1)];
    var k = (ft - a.t) / ((b2.t - a.t) || 1);
    var bx = a.bx + (b2.bx-a.bx)*k, by = a.by + (b2.by-a.by)*k, bz = a.bz + (b2.bz-a.bz)*k;
    WORLD.ball.position.set(bx, by, bz);
    WORLD.blob.position.set(bx, 0.022, bz);
    var bs = 0.7 + Math.max(0, by-0.15)*0.55;
    WORLD.blob.scale.set(bs, bs, 1);
    WORLD.blob.material.opacity = Math.max(0.12, 0.5 - (by-0.15)*0.22);
    for(var pi=0; pi<SIM.players.length; pi++){
      var pl = SIM.players[pi];
      if(pl.off || !pl.mesh){ if(pl.mesh) pl.mesh.visible = false; continue; }
      pl.mesh.visible = true;
      var o = pi*REC.stride;
      var x = a.p[o] + (b2.p[o]-a.p[o])*k;
      var z = a.p[o+1] + (b2.p[o+1]-a.p[o+1])*k;
      var face = a.p[o+2] + SIM._angDelta(a.p[o+2], b2.p[o+2])*k;
      var frame=k<.5?a:b2,act=frame.p[o+3]|0;
      pl.mesh.position.set(x, 0, z);
      pl.mesh.rotation.y = face;
      var phase=a.p[o+6]+((b2.p[o+6]-a.p[o+6]+1)%1)*k;
      pl.mesh.userData.phase=phase%1;
      WORLD.animatePlayer(pl.mesh,a.p[o+5]+(b2.p[o+5]-a.p[o+5])*k,0,REC.actions[act],frame.p[o+4],0,0,frame.p[o+7]);
    }
    WORLD.playerShadows(SIM.players);
    this._prev = { bx: bx, bz: bz };
  },

  _cam: function(){
    var bp = WORLD.ball.position;
    var k = Math.min(1, this.t / this.dur);
    var d = this.goalDir;
    if(k < 0.42){
      /* PLAN A: niska kamera od strony bocznej — prowadzi piłkę jak operator */
      var cz = -this.side * 19;
      WORLD.cam.position.set(
        Math.max(-42, Math.min(42, bp.x*0.9)),
        2.6 + k*1.4,
        cz - this.side * Math.max(0, Math.abs(bp.z)-8)*0.35 );
      WORLD.cam.lookAt(bp.x, Math.max(0.6, bp.y), bp.z);
      WORLD.cam.fov = 34 - k*5;
    } else {
      /* PLAN B: zza akcji — najazd na bramkę wraz z dobiegiem piłki */
      var kk = (k - 0.42) / 0.58;
      var dist = 15 - kk*7;
      WORLD.cam.position.set(
        bp.x - d*dist,
        5.6 - kk*2.6,
        Math.max(-30, Math.min(30, bp.z*0.8)) );
      WORLD.cam.lookAt(d*HL, 1.5, bp.z*0.4);
      WORLD.cam.fov = 40 - kk*14;
    }
    WORLD.cam.updateProjectionMatrix();
  }
};

/* Ekran przedmeczowy i tablica taktyczna. */
var DESK = {
  page:"teams", editingMatch:false,
  select: function(page){
    this.page=page;
    document.querySelectorAll("[data-page]").forEach(function(button){
      var selected = button.dataset.page===page;
      button.classList.toggle("on",selected);
      button.setAttribute("aria-pressed",String(selected));
      document.getElementById("page-"+button.dataset.page).hidden=!selected;
    });
  },
  editing: function(on){
    this.editingMatch=on;
    document.querySelectorAll("#segMode button,#segHalf button,#inHome,#inAway").forEach(function(control){ control.disabled=on; });
    this.refresh();
  },
  init: function(){
    document.querySelector(".tabs").addEventListener("click",function(e){
      var button=e.target.closest("[data-page]");
      if(button){ DESK.select(button.dataset.page); UI_click(); }
    });
    this.select("teams"); this.refresh();
  },
  refresh: function(){
    document.getElementById("playText").textContent=t(this.editingMatch?"p_resume":"b_play");
    document.getElementById("summaryMode").textContent=t("mode"+SET.mode);
    document.getElementById("summaryRules").textContent="2 × "+SET.half/60+" min  ·  "+t("d"+SET.diff);
    document.getElementById("lightName").textContent=t("n"+SET.night);
    ["H","A"].forEach(function(side,team){
      var name=team===0?SET.home:SET.away;
      document.getElementById("in"+(team===0?"Home":"Away")).setAttribute("aria-label",t(team===0?"s_home":"s_away"));
      document.getElementById("tName"+side+"T").textContent=name;
      document.getElementById("plan"+side).textContent=LINEUP.formation(team)+"   ·   "+t("plan_"+LINEUP.tactic(team));
      SHOWROOM.portrait(document.getElementById("kit"+side),team);
      DESK.pitch(document.getElementById("formPitch"+side),team);
    });
  },
  pitch: function(canvas,team){
    var g=canvas.getContext("2d"), w=canvas.width,h=canvas.height;
    g.clearRect(0,0,w,h); g.fillStyle="#163e33"; g.fillRect(0,0,w,h);
    var x=12,y=12,pw=w-24,ph=h-24;
    g.lineWidth=2; g.strokeStyle="#b5d6bf65"; g.strokeRect(x,y,pw,ph);
    g.beginPath(); g.moveTo(w/2,y);g.lineTo(w/2,y+ph);g.stroke();
    g.beginPath();g.arc(w/2,h/2,ph*.15,0,2*Math.PI);g.stroke();
    [x,x+pw-41].forEach(function(left){g.strokeRect(left,h*.28,41,h*.44);});

  camera:function(dt){
    this.elapsed+=dt;
    var cam=WORLD.cam,view=this.view,p,look,fov,aspect=Math.max(.5,cam.aspect);
    if(view===0){
      var a=-.48+.18*Math.sin(this.elapsed*.10);

    if(cam.fov!==fov){cam.fov=fov;cam.updateProjectionMatrix();}
  },
  close:function(){
    if(!this.active)return;this.active=false;this.el.classList.add("hide");
    document.getElementById(this.origin).classList.remove("hide");
    if(this.saved.hud)document.getElementById("hud").classList.add("show");
    WORLD.cam.position.copy(this.saved.p);WORLD.cam.quaternion.copy(this.saved.q);WORLD.cam.fov=this.saved.fov;WORLD.cam.updateProjectionMatrix();
    INPUT.wheelAcc=0;
    document.getElementById(this.origin==="ovMenu"?"btnTour":"btnPauseTour").focus();
  }
};

;
/* ============================================================
   SUPER PILKA '98 · 11-main.js — bootstrap, pętla, sterowanie
   ============================================================ */
var MAIN = {
  lastT: 0, fps: 60, fpsAcc: 0, fpsN: 0, fpsT: 0,
  chargeP:[0,0], chargeS:[0,0], combo:[false,false], finesse:[false,false],
  paused: false, running: false,

  boot: function(){
    var canvas = document.getElementById("c");
    try{ WORLD.init(canvas); }catch(e){
      document.getElementById("splash").lastElementChild.textContent="Brak dostępu do WebGL. Włącz akcelerację grafiki w przeglądarce.";
      console.error(e);return;
    }
    SET_bindAll();
    SET_applyLang();
    INPUT.init();
    HUD.refreshTeams();
    this.bindUI(); DESK.init(); STADIUM_TOUR.init();
    window.addEventListener("resize", function(){ WORLD.resize(); });
    document.getElementById("splash").style.display = "none";
    this.state = "menu";
    BROADCAST.clear();RULES.state = "menu";
    requestAnimationFrame(function(t){ MAIN.loop(t); });
  },

  bindUI: function(){
    var self = this;
    document.getElementById("btnPlay").addEventListener("click", function(){
      if(DESK.editingMatch){document.getElementById("ovMenu").classList.add("hide");DESK.editing(false);self.togglePause(false);}
      else self.startMatch();
    });
    document.getElementById("btnHelp").addEventListener("click", function(){
      AUDIO.init(); AUDIO.resume(); AUDIO.ui();
      document.getElementById("ovMenu").classList.add("hide");
      document.getElementById("ovHelp").classList.remove("hide");
    });
    document.getElementById("btnHelpBack").addEventListener("click", function(){
      AUDIO.ui();
      document.getElementById("ovHelp").classList.add("hide");
      document.getElementById("ovMenu").classList.remove("hide");
    });
    document.getElementById("btnResume").addEventListener("click", function(){ self.togglePause(false); });
    document.getElementById("btnSet").addEventListener("click", function(){
      AUDIO.ui();
      document.getElementById("ovPause").classList.add("hide");
      document.getElementById("ovMenu").classList.remove("hide");
      DESK.select("tactics"); DESK.editing(true);
    });
    document.getElementById("btnRestart").addEventListener("click", function(){ self.startMatch(); });
    document.getElementById("btnQuit").addEventListener("click", function(){ self.toMenu(); });
    document.getElementById("btnRematch").addEventListener("click", function(){ self.startMatch(); });
    document.getElementById("btnEndMenu").addEventListener("click", function(){ self.toMenu(); });
  },

  startMatch: function(){
    AUDIO.init(); AUDIO.resume(); AUDIO.ui();
    document.getElementById("ovMenu").classList.add("hide");
    document.getElementById("ovHelp").classList.add("hide");
    document.getElementById("ovPause").classList.add("hide");
    HUD.hideEnd();
    if(REPLAY.active)REPLAY.finish();
    HUD.replayUI(false);HUD.showPower(null);HUD.el("banner").classList.remove("show");
    HUD.commentary("");this.chargeS=[0,0];this.chargeP=[0,0];this.combo=[false,false];this.finesse=[false,false];
    DESK.editing(false); CAM._last=null;
    PITCH.reset();STADIUM.goalTeam=-1;STADIUM.goalLeft=0;
    RULES.newMatch();
    WORLD.refreshAds(SET.home, SET.away);
    HUD.refreshTeams();
    /* podpowiedź kick-offu zostaje — nie nadpisuj jej „ESC — pauza” */
    document.getElementById("hud").classList.add("show");
    this.paused = false;
    this.state = "match";
  },
  toMenu: function(){
    AUDIO.ui();
    document.getElementById("ovPause").classList.add("hide");
    HUD.hideEnd();
    document.getElementById("ovMenu").classList.remove("hide");
    document.getElementById("hud").classList.remove("show");
    WORLD.m1.visible = false; WORLD.m2.visible = false;
    WORLD.aimArrow.visible = false;
    BROADCAST.clear();RULES.state = "menu";
    this.state = "menu";
    if(REPLAY.active)REPLAY.finish();
    DESK.editing(false);this.paused=false;
  },
  togglePause: function(on){
    if(on === undefined) on = !this.paused;
    this.paused = on;
    document.getElementById("ovPause").classList.toggle("hide", !on);
    if(on){
      this.el2("pScore").textContent = SET.home + "  " + SIM.teams[0].score + " : " + SIM.teams[1].score + "  " + SET.away;
      HUD.stats("pauseStats");AUDIO.ui();
    }
  },
  el2: function(id){ return document.getElementById(id); },

  /* ---------- sterowanie człowieka ---------- */
  humanControl: function(dt){
    var b=SIM.ball, power=0;
    for(var s=0;s<2;s++){
      if(!RULES.humanTaker(s))continue;
      var inp=INPUT.slots[s],team=SIM.teams[s],user=team.user;
      team.switchCd=Math.max(0,team.switchCd-dt);
      var forced=b.owner && b.owner.team===s?b.owner:(!b.owner && b.receiver && b.receiver.team===s?b.receiver:null);
      var near=SIM.nearestToBall(s,true);
      if(forced && !forced.off && forced!==user){SIM.control(s,forced);team.switchCd=.3;}
      else if(!user || user.off){SIM.control(s,near);}
      else if(!forced && team.switchCd===0 && near && near!==user){
        var gap=Math.hypot(user.pos.x-b.x,user.pos.z-b.z)-Math.hypot(near.pos.x-b.x,near.pos.z-b.z);
        if(gap>8){SIM.control(s,near);team.switchCd=.35;}
      }
      if(inp.switchP && !forced && team.switchCd<=0){
        var candidates=SIM.teamPlayers(s).filter(function(p){return p!==team.user && p.role!=="GK";});
        candidates.sort(function(a,c){return Math.hypot(a.pos.x-b.x,a.pos.z-b.z)-Math.hypot(c.pos.x-b.x,c.pos.z-b.z);});
        if(candidates.length){SIM.control(s,candidates[0]);team.switchCd=.8;}
      }
      user=team.user;if(!user)continue;
      if(user.isUser!==s)SIM.control(s,user);
      user.closeControl=!!inp.jockey;
      var field=CAM.fieldInput(inp.mx,inp.mz);
      var dx=inp.moveLen>.15?field.x:Math.sin(user.face), dz=inp.moveLen>.15?field.z:Math.cos(user.face);
      user.moveTarget=inp.moveLen>.15?{x:user.pos.x+dx*5,z:user.pos.z+dz*5,amount:inp.moveLen,sprint:inp.sprint&&!inp.jockey}:null;
      if(user.action==="fallen" || user.action==="slide" || user.action==="dive"){
        this.chargeP[s]=this.chargeS[s]=0;continue;
      }
      if(b.owner!==user){
        this.chargeP[s]=this.chargeS[s]=0;this.combo[s]=this.finesse[s]=false;
        if(!b.owner && b.receiver===user && !user.moveTarget)user.moveTarget=AI.receiveTarget(user);
        if(b.owner && b.owner.team!==s && inp.pass && !inp.moveLen)
          user.moveTarget={x:b.x+b.owner.vel.x*.10,z:b.z+b.owner.vel.z*.10,sprint:!inp.jockey};
        if(inp.tackleP)SIM.startSlide(user);
        else if(inp.shootP)SIM.standingTackle(user);
        continue;
      }
      if(inp.pass){
        this.chargeP[s]=Math.min(1,this.chargeP[s]+dt/.65);
        this.combo[s]=this.combo[s]||inp.switchL;
      } else if(this.chargeP[s]>0){
        var passing=Math.max(.16,this.chargeP[s]),mate=SIM.pickPassTarget(s,dx,dz,false,user);
        SIM.deliver(user,mate,"pass",passing,dx,dz);
        if(this.combo[s] && mate)user.runT=2.7;
        this.chargeP[s]=this.chargeS[s]=0;this.combo[s]=false;
        if(mate)SIM.control(s,mate);
        continue;
      }
      if(inp.throughP || inp.tackleP){
        var cross=inp.tackleP, target=SIM.pickPassTarget(s,dx,dz,true,user);
        if(cross){
          var goalX=SIM.dirX(s)*(HL-10), mates=SIM.teamPlayers(s).filter(function(p){return p!==user && p.role!=="GK";});
          mates.sort(function(a,c){return Math.hypot(a.pos.x-goalX,a.pos.z*.84)-Math.hypot(c.pos.x-goalX,c.pos.z*.84);});
          target=mates[0]||target;
        }
        SIM.deliver(user,target,cross?"cross":"through",.73,dx,dz);
        if(target)SIM.control(s,target);
        this.chargeP[s]=this.chargeS[s]=0;this.combo[s]=false;continue;
      }
      if(inp.shoot){
        this.chargeS[s]=Math.min(1,this.chargeS[s]+dt/.78);
        this.finesse[s]=this.finesse[s]||inp.finesse;
      }else if(this.chargeS[s]>0){
        var dir=SIM.dirX(s), finesse=this.finesse[s]||inp.finesse, pw=Math.max(.23,this.chargeS[s]);
        var targetZ=inp.moveLen>.15?dz*3.50:-Math.sign(user.pos.z||1)*(finesse?2.65:1.25);
        var gx=dir*HL-b.x,gz=targetZ-b.z, curve=0;
        if(finesse){
          curve=-(Math.sign(user.pos.z)||dir)*dir*(4+pw*1.5);
          var travel=Math.min(1.35,Math.hypot(gx,gz)/(17+11*pw));
          gz-=dir*curve*travel*travel*.5;
        }
        SIM.kick(user,gx,gz,pw,finesse?"finesse":"shot");
        if(finesse)b.curve=curve;
        RULES.onShot(user);this.chargeS[s]=this.chargeP[s]=0;this.finesse[s]=false;
      }
      power=Math.max(power,this.chargeP[s],this.chargeS[s]);
    }
    HUD.showPower(power||null);
  },

  markers: function(){
    var m1 = WORLD.m1, m2 = WORLD.m2;
    if(["replay","goal","booking","halftime","fulltime"].includes(RULES.state)){ m1.visible = false; m2.visible = false; return; }
    var u0 = SIM.teams[0] && SIM.teams[0].user, u1 = SIM.teams[1] && SIM.teams[1].user;
    if(this.state==="match" && u0 && !u0.off){
      m1.visible = true;
      m1.position.set(u0.pos.x, 0, u0.pos.z);
      m1.userData.arrow.rotation.y=performance.now()*.0018;
      m1.userData.arrow.position.y = 2.18 + Math.sin(performance.now()/300)*0.06;
    } else m1.visible = false;
    if(this.state==="match" && u1 && !u1.off){
      m2.visible = true;
      m2.position.set(u1.pos.x, 0, u1.pos.z);
      m2.userData.arrow.rotation.y=performance.now()*.0018;
      m2.userData.arrow.position.y = 2.18 + Math.cos(performance.now()/300)*0.06;
    } else m2.visible = false;
  },

  /* ---------- główna pętla ---------- */
  loop: function(tms){
    var self = this;
    requestAnimationFrame(function(t){ self.loop(t); });
    var rawDt = (tms - this.lastT)/1000;
    var dt = Math.min(0.1, Math.max(0.001, rawDt));
    this.lastT = tms;
    /* prawdziwy fps liczony z nieograniczonego odstępu */
    this.fpsAcc += rawDt; this.fpsN++;
    if(this.fpsAcc > 0.5){
      this.fps = Math.round(this.fpsN/this.fpsAcc);
      this.fpsAcc = 0; this.fpsN = 0;

    }

    INPUT.update();

    if(STADIUM_TOUR.active){
      if(INPUT.slots[0].pauseP||INPUT.slots[1].pauseP)STADIUM_TOUR.close();
      else{STADIUM_TOUR.camera(dt);WORLD.tick(dt);WORLD.renderer.render(WORLD.scene,WORLD.cam);}
      return;
    }
    if(SHOWROOM.active){
      if(INPUT.slots[0].pauseP || INPUT.slots[1].pauseP)SHOWROOM.close();
      else SHOWROOM.update(dt);
      return;
    }
    /* pauza / menu — klawisze */
    if(this.state==="match" && !DESK.editingMatch){
      var s1 = INPUT.slots[0], s2 = INPUT.slots[1];
      if((s1.pauseP || s2.pauseP) && RULES.state!=="fulltime") this.togglePause();
      if(!this.paused && !["replay","goal","booking"].includes(RULES.state) && (s1.camP || s2.camP)){
        CAM.setMode(SET.cam+1);syncCameraMenu();SET_save();AUDIO.ui();
      }
      /* interaktywny zoom kamery: kółko myszy / klucze + − (poza powtórką) */
      if(RULES.state !== "replay"){
        if(INPUT.wheelAcc){ CAM.zoomBy(INPUT.wheelAcc * 0.0011); }
        var zk = INPUT.zoomKey();
        if(zk) CAM.zoomBy(-zk * dt * 1.3);
      }
      INPUT.wheelAcc = 0;
    }

    if(this.state==="menu"){
      /* tryb attract: pusta arena (flagi, kibice i telebim żyją też w menu) */
      CAM.update(dt, "menu");
      WORLD.tick(dt);
      WORLD.renderer.render(WORLD.scene, WORLD.cam);
      return;
    }
    if(this.paused){
      WORLD.renderer.render(WORLD.scene, WORLD.cam);
      return;
    }

    // Małe kroki zapobiegają przelatywaniu piłki przez zawodników przy niskim FPS.
    var n=Math.ceil(dt*60), step=dt/n;
    for(var tick=0;tick<n;tick++){
      var was=RULES.state;
      RULES.update(step);
      if(RULES.state==="play"){
        if(was!=="play")INPUT.consumeEdges();
        this.humanControl(step);AI.update(step);SIM.step(step);REC.push(step);
      }
      INPUT.consumeEdges();
    }
    if(RULES.state!=="replay")SIM.syncMeshes(dt);
    CAM.update(dt, RULES.state==="menu" ? "menu" : RULES.state);
    this.markers();
    HUD.update(dt);

    /* emocje tłumu */
    var b = SIM.ball;
    var prox = Math.max(0, 1 - Math.min(Math.abs(b.x-HL), Math.abs(b.x+HL))/40);
    AUDIO.excitementSet(0.12 + prox*0.3 + (b.owner?0.06:0.1));
    AUDIO.update(dt);
    /* trybuny: podskok tłumu przy golu, cichy szum w trakcie gry */
    if(RULES.state==="goal") WORLD.crowdPulse = 1;
    else if(RULES.state==="replay") WORLD.crowdPulse = 0.35;
    else WORLD.crowdPulse = Math.max(0, (WORLD.crowdPulse||0) - dt*0.5);
    WORLD.tick(dt);
    WORLD.tickStaff(dt, RULES.state);

    WORLD.renderer.render(WORLD.scene, WORLD.cam);
  }
};

/* przycisk pauzy = powrót do gry; ustawienia w pauzie pokazują menu */

  var padWatch = setInterval(function(){

      if(INPUT.anyPadButton()){
        INPUT.update();
        MAIN.startMatch();
      }
    }
  }, 300);
